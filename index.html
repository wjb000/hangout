<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout · VLA World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="hud-top">
    <div id="goals"></div>
    <div id="status">booting VLA world…</div>
  </div>

  <canvas id="world" aria-label="simulation world"></canvas>
  <canvas id="vision" width="360" height="220" aria-label="VLA egocentric camera"></canvas>
  <div id="vision-meta">VLA eye · offline</div>

  <div id="chatlog" aria-label="chat log"></div>

  <div id="debug" class="hidden" aria-label="debug overlay">
    <div class="dbg-title">debug <kbd>D</kbd> hide</div>
    <pre id="dbg-body"></pre>
  </div>

  <div id="progress"><i></i></div>
  <div id="hint">move mouse = you · <kbd>D</kbd> debug · WebGPU VLA</div>

  <script type="module" src="main.js"></script>
</body>
</html>
