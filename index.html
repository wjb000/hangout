<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="viewport"></div>
  <div id="crosshair">+</div>

  <header id="top">
    <div class="brand">hangout</div>
    <button type="button" id="who" title="Change name"></button>
    <span id="link" class="dim">finding people…</span>
  </header>

  <ul id="pills"></ul>
  <div id="toast"></div>

  <div id="chat" class="idle">
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" maxlength="160" placeholder="Say something" autocomplete="off" />
    </form>
  </div>

  <p id="hint">click the world to look around · wasd</p>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script type="module" src="lobby.js"></script>
</body>
</html>
