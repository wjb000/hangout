<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hangout</title>
  <link rel="stylesheet" href="styles.css?v=12" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewport"></div>
  <div id="boot"><span>hangout</span><small>loading world</small></div>

  <header id="top">
    <div class="brand">hangout</div>
    <button type="button" id="who">you</button>
    <span id="link" class="dim">connecting</span>
  </header>

  <ul id="pills"></ul>
  <div id="toast"></div>
  <div id="worlds"></div>
  <div id="picker"></div>

  <div id="chat">
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" maxlength="160" placeholder="T to talk" autocomplete="off" />
    </form>
  </div>

  <p id="hint">WASD · drag to look · scroll to zoom · shift to run</p>
  <script type="module" src="world.mjs?v=12"></script>
</body>
</html>
