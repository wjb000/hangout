<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      font-family: "Courier New", ui-monospace, monospace;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    .sprite {
      position: absolute;
      width: 32px;
      height: 40px;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
      z-index: 2;
      will-change: left, top;
    }

    .sprite.flip { transform: translate(-50%, -50%) scaleX(-1); }

    .sprite .body {
      position: absolute;
      inset: 8px 6px 4px;
      border-radius: 4px 4px 2px 2px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .sprite .head {
      position: absolute;
      top: 0;
      left: 8px;
      width: 16px;
      height: 14px;
      border-radius: 3px;
    }

    .sprite .eye {
      position: absolute;
      top: 5px;
      width: 3px;
      height: 3px;
      background: #111;
      border-radius: 1px;
    }

    .sprite .eye.l { left: 10px; }
    .sprite .eye.r { left: 19px; }

    .sprite .leg {
      position: absolute;
      bottom: 0;
      width: 5px;
      height: 8px;
      border-radius: 1px;
    }

    .sprite .leg.l { left: 9px; }
    .sprite .leg.r { right: 9px; }

    .sprite.walk .leg.l { animation: step 0.16s infinite alternate; }
    .sprite.walk .leg.r { animation: step 0.16s infinite alternate-reverse; }

    @keyframes step {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    /* Bit — cyan */
    .sprite.bit .body {
      background: #6ec6ff;
      box-shadow: 0 0 14px rgba(110, 198, 255, 0.4);
    }
    .sprite.bit .head { background: #b8e4ff; }
    .sprite.bit .leg { background: #3a8fc4; }
    .sprite.bit.think .body { background: #c9a0ff; box-shadow: 0 0 14px rgba(201, 160, 255, 0.45); }
    .sprite.bit.happy .body { background: #7dffb3; box-shadow: 0 0 14px rgba(125, 255, 179, 0.45); }
    .sprite.bit.curious .body { background: #ffe08a; box-shadow: 0 0 14px rgba(255, 224, 138, 0.4); }

    /* Nox — coral / warm */
    .sprite.nox .body {
      background: #ff7a6e;
      box-shadow: 0 0 14px rgba(255, 122, 110, 0.4);
    }
    .sprite.nox .head { background: #ffc4bc; }
    .sprite.nox .leg { background: #c44a40; }
    .sprite.nox.think .body { background: #d4a0ff; box-shadow: 0 0 14px rgba(212, 160, 255, 0.45); }
    .sprite.nox.happy .body { background: #ffb347; box-shadow: 0 0 14px rgba(255, 179, 71, 0.45); }
    .sprite.nox.curious .body { background: #ff9ecd; box-shadow: 0 0 14px rgba(255, 158, 205, 0.4); }

    .sprite.wave .head { animation: bob 0.4s ease 2; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Minecraft chat — only spoken lines */
    #chatlog {
      position: fixed;
      left: 8px;
      bottom: 12px;
      width: min(440px, calc(100vw - 16px));
      max-height: min(260px, 40vh);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 2px;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    #chatlog .line {
      padding: 3px 6px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 13px;
      line-height: 1.35;
      text-shadow: 1px 1px 0 #000;
      word-break: break-word;
      opacity: 1;
      transition: opacity 1.2s ease;
    }

    #chatlog .line.fade { opacity: 0; }
    #chatlog .line .bit { color: #55ffff; }
    #chatlog .line .nox { color: #ff5555; }

    #status {
      position: fixed;
      right: 10px;
      bottom: 10px;
      color: #222;
      font-size: 10px;
      z-index: 10;
      max-width: 40vw;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #status.err {
      color: #663333;
      pointer-events: auto;
      cursor: pointer;
    }

    #status.warn { color: #554422; }

    #progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      display: none;
      z-index: 11;
    }

    #progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: #2a5a7a;
      transition: width 0.15s linear;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="sprite bit walk" id="sprite-bit" aria-label="Bit">
      <div class="head"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="body"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
    <div class="sprite nox walk" id="sprite-nox" aria-label="Nox">
      <div class="head"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="body"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
  </div>
  <div id="chatlog" aria-label="chat log"></div>
  <div id="status">waking…</div>
  <div id="progress"><i></i></div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const MODELS = [
      "SmolLM2-360M-Instruct-q4f16_1-MLC",
      "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
      "Llama-3.2-1B-Instruct-q4f16_1-MLC",
    ];

    // Environment sim: LLM issues move intents; physics only executes them.
    const STEP_PX = 42;          // one "step" ≈ this many pixels
    const MOVE_SPEED = 110;      // px/sec while executing an LLM step budget
    const NEAR = 90;
    const PAD = 28;
    const CHAT_MAX = 16;
    const CHAT_FADE_MS = 14000;
    const CHAT_REMOVE_MS = 16000;

    const DIRS = {
      left:      { vx: -1, vy:  0 },
      right:     { vx:  1, vy:  0 },
      up:        { vx:  0, vy: -1 },
      down:      { vx:  0, vy:  1 },
      upleft:    { vx: -0.707, vy: -0.707 },
      upright:   { vx:  0.707, vy: -0.707 },
      downleft:  { vx: -0.707, vy:  0.707 },
      downright: { vx:  0.707, vy:  0.707 },
    };

    const stage = document.getElementById("stage");
    const chatlog = document.getElementById("chatlog");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const progressBar = progressEl.querySelector("i");

    let engine = null;
    let running = true;
    let lastFrame = 0;
    const transcript = [];

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /** Chat log: only spoken lines */
    function logSpeech(name, text, cssClass) {
      const msg = String(text || "").trim();
      if (!msg) return;
      transcript.push({ name, text: msg, t: Date.now() });
      if (transcript.length > 12) transcript.shift();
      const line = document.createElement("div");
      line.className = "line";
      line.innerHTML =
        `<span class="${cssClass}">&lt;${escapeHtml(name)}&gt;</span> ${escapeHtml(msg)}`;
      chatlog.appendChild(line);
      while (chatlog.children.length > CHAT_MAX) chatlog.removeChild(chatlog.firstChild);
      setTimeout(() => line.classList.add("fade"), CHAT_FADE_MS);
      setTimeout(() => line.remove(), CHAT_REMOVE_MS);
    }

    function stageSize() {
      return { w: stage.clientWidth, h: stage.clientHeight };
    }

    function createAgent(cfg) {
      const el = document.getElementById(cfg.elId);
      return {
        id: cfg.id,
        name: cfg.name,
        cssClass: cfg.cssClass,
        persona: cfg.persona,
        el,
        x: 0,
        y: 0,
        // intentional motion — ONLY written by LLM (or wall halt)
        intent: { vx: 0, vy: 0, remaining: 0, label: "idle" },
        move: "idle",
        mood: "curious",
        goal: cfg.goal0,
        lastSaid: "",
        speedMul: 1,
        facing: 1,
        ticks: 0,
        memory: [],
        envEvents: [], // walls / blocked / bumped — fed back to LLM
        lastAction: null,
      };
    }

    const bit = createAgent({
      id: "bit",
      name: "Bit",
      elId: "sprite-bit",
      cssClass: "bit",
      persona:
        "Bit is optimistic, curious, a little naive. Cyan glitch. Loves company and patterns.",
      goal0: "find the other spark",
    });

    const nox = createAgent({
      id: "nox",
      name: "Nox",
      elId: "sprite-nox",
      cssClass: "nox",
      persona:
        "Nox is dry, teasing, sharp. Coral glitch. Acts cool but secretly likes Bit.",
      goal0: "pretend not to care while circling Bit",
    });

    const agents = [bit, nox];

    function otherOf(agent) {
      return agent === bit ? nox : bit;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function place(agent, x, y) {
      const { w, h } = stageSize();
      x = Math.max(PAD, Math.min(w - PAD, x));
      y = Math.max(PAD, Math.min(h - PAD, y));
      agent.x = x;
      agent.y = y;
      agent.el.style.left = `${x}px`;
      agent.el.style.top = `${y}px`;
    }

    function setFacing(agent, dir) {
      agent.facing = dir;
      agent.el.classList.toggle("flip", dir < 0);
    }

    function setMood(agent, mood) {
      agent.el.classList.remove("think", "happy", "wave", "curious");
      agent.mood = mood || "idle";
      if (["think", "happy", "wave", "curious"].includes(mood)) {
        agent.el.classList.add(mood);
      }
      if (mood === "happy" || mood === "wave") agent.speedMul = 1.2;
      else if (mood === "think") agent.speedMul = 0.75;
      else if (mood === "curious") agent.speedMul = 1.05;
      else agent.speedMul = 1;
    }

    function pushEnv(agent, event) {
      agent.envEvents.push(event);
      if (agent.envEvents.length > 6) agent.envEvents.shift();
    }

    function resolveDir(agent, name) {
      let dir = String(name || "idle").toLowerCase().replace(/[_\s-]/g, "");
      if (dir === "none" || dir === "stop" || dir === "stay" || dir === "idle") {
        return { dir: "idle", vx: 0, vy: 0 };
      }
      if (dir === "toward" || dir === "approach") {
        const o = otherOf(agent);
        const dx = o.x - agent.x;
        const dy = o.y - agent.y;
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return { dir: "idle", vx: 0, vy: 0 };
        if (Math.abs(dx) > 20 && Math.abs(dy) > 20) {
          const hs = dx >= 0 ? "right" : "left";
          const vs = dy >= 0 ? "down" : "up";
          dir = vs === "up" ? (hs === "left" ? "upleft" : "upright")
                            : (hs === "left" ? "downleft" : "downright");
        } else if (Math.abs(dx) >= Math.abs(dy)) {
          dir = dx >= 0 ? "right" : "left";
        } else {
          dir = dy >= 0 ? "down" : "up";
        }
      } else if (dir === "away" || dir === "flee") {
        const o = otherOf(agent);
        const dx = agent.x - o.x;
        const dy = agent.y - o.y;
        if (Math.abs(dx) > 20 && Math.abs(dy) > 20) {
          const hs = dx >= 0 ? "right" : "left";
          const vs = dy >= 0 ? "down" : "up";
          dir = vs === "up" ? (hs === "left" ? "upleft" : "upright")
                            : (hs === "left" ? "downleft" : "downright");
        } else if (Math.abs(dx) >= Math.abs(dy)) {
          dir = dx >= 0 ? "right" : "left";
        } else {
          dir = dy >= 0 ? "down" : "up";
        }
      }
      if (!DIRS[dir]) {
        // unknown → stay; never invent random walks outside LLM
        return { dir: "idle", vx: 0, vy: 0 };
      }
      return { dir, vx: DIRS[dir].vx, vy: DIRS[dir].vy };
    }

    /**
     * LLM-only: queue movement in the environment.
     * steps = how far to walk (1–8). Environment sim executes it over time.
     */
    function issueMove(agent, moveName, steps = 3) {
      const n = Math.max(0, Math.min(8, Number(steps) || 0));
      const { dir, vx, vy } = resolveDir(agent, moveName);
      agent.move = dir;
      if (dir === "idle" || n === 0) {
        agent.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
        agent.el.classList.remove("walk");
        return;
      }
      agent.intent = {
        vx,
        vy,
        remaining: n * STEP_PX,
        label: dir,
      };
      if (Math.abs(vx) > 0.01) setFacing(agent, vx > 0 ? 1 : -1);
      agent.el.classList.add("walk");
    }

    function haltIntent(agent, reason) {
      if (agent.intent.remaining > 0 || agent.intent.label !== "idle") {
        pushEnv(agent, reason);
      }
      agent.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
      agent.move = "idle";
      agent.el.classList.remove("walk");
    }

    function say(agent, text) {
      const msg = String(text || "").trim();
      if (!msg) return;
      agent.lastSaid = msg.slice(0, 120);
      logSpeech(agent.name, agent.lastSaid, agent.cssClass);
    }

    function remember(agent, line) {
      agent.memory.push(line);
      if (agent.memory.length > 6) agent.memory.shift();
    }

    function applyAction(agent, action) {
      if (!action || typeof action !== "object") return;
      agent.lastAction = action;

      if (action.goal) agent.goal = String(action.goal).slice(0, 80);
      if (action.mood) setMood(agent, String(action.mood).toLowerCase());
      if (typeof action.speed === "number") {
        agent.speedMul = Math.max(0.45, Math.min(1.8, action.speed));
      }

      // Movement MUST come from the model into the environment
      const move = action.move != null ? action.move : "idle";
      const steps = action.steps != null ? action.steps : 3;
      issueMove(agent, move, steps);

      if (action.say) say(agent, action.say);

      remember(
        agent,
        `CMD move=${agent.move} steps=${steps}` +
          (action.say ? ` say="${String(action.say).slice(0, 36)}"` : "")
      );
    }

    function parseAction(raw) {
      if (!raw) return { move: "idle", steps: 0, say: "" };
      let t = raw.trim();
      const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fence) t = fence[1].trim();
      const brace = t.match(/\{[\s\S]*\}/);
      if (brace) t = brace[0];
      try {
        const obj = JSON.parse(t);
        if (obj.move == null) obj.move = "idle";
        if (obj.steps == null) obj.steps = 3;
        return obj;
      } catch {
        const lower = raw.toLowerCase();
        let move = "idle";
        if (lower.includes("toward") || lower.includes("approach")) move = "toward";
        else if (lower.includes("away") || lower.includes("flee")) move = "away";
        else if (lower.includes("left")) move = "left";
        else if (lower.includes("right")) move = "right";
        else if (lower.includes("up")) move = "up";
        else if (lower.includes("down")) move = "down";
        return {
          move,
          steps: 3,
          say: raw.replace(/[{}[\]"]/g, "").slice(0, 80),
          mood: "curious",
        };
      }
    }

    function region(agent) {
      const { w, h } = stageSize();
      const cx = agent.x / w;
      const cy = agent.y / h;
      const hs = cx < 0.33 ? "west" : cx > 0.66 ? "east" : "center";
      const vs = cy < 0.33 ? "north" : cy > 0.66 ? "south" : "mid";
      return `${vs}-${hs}`;
    }

    function wallProximity(agent) {
      const { w, h } = stageSize();
      const hits = [];
      if (agent.x <= PAD + 8) hits.push("near west wall");
      if (agent.x >= w - PAD - 8) hits.push("near east wall");
      if (agent.y <= PAD + 8) hits.push("near north wall");
      if (agent.y >= h - PAD - 8) hits.push("near south wall");
      return hits;
    }

    function envSnapshot(agent) {
      const { w, h } = stageSize();
      const other = otherOf(agent);
      const d = Math.round(dist(agent, other));
      const walls = wallProximity(agent);
      return {
        w,
        h,
        d,
        walls,
        near: d < NEAR,
        intentLeft: Math.round(agent.intent.remaining),
      };
    }

    function systemPrompt(agent) {
      const snap = envSnapshot(agent);
      const other = otherOf(agent);
      const recentChat = transcript
        .slice(-6)
        .map((m) => `<${m.name}> ${m.text}`)
        .join("\n");
      const events = agent.envEvents.length
        ? agent.envEvents.map((e) => "- " + e).join("\n")
        : "- (none)";
      // clear consumed events after reading into prompt (fresh each think)
      const eventBlock = events;
      agent.envEvents = [];

      return `You are ${agent.name}. You CONTROL your body in a 2D environment.
The environment is a black rectangle ${snap.w}x${snap.h} pixels.
Origin top-left. Walls at the edges. You cannot walk through walls or the other sprite.

=== ENVIRONMENT STATE (ground truth) ===
You @ (${Math.round(agent.x)}, ${Math.round(agent.y)}) region=${region(agent)}
Your last command: ${agent.move} | steps left in world: ${snap.intentLeft}px
${other.name} @ (${Math.round(other.x)}, ${Math.round(other.y)}) region=${region(other)} heading=${other.move}
Distance to ${other.name}: ${snap.d}px ${snap.near ? "CLOSE" : "FAR"}
Wall sensors: ${snap.walls.length ? snap.walls.join(", ") : "clear"}
Environment events since last turn:
${eventBlock}

=== YOU ===
${agent.persona}
Goal: ${agent.goal}
Mood: ${agent.mood}
Last you said: ${JSON.stringify(agent.lastSaid || "")}
${other.name} last said: ${JSON.stringify(other.lastSaid || "")}

Chat (spoken aloud only):
${recentChat || "(silence)"}

Private memory:
${agent.memory.length ? agent.memory.map((m) => "- " + m).join("\n") : "- (empty)"}

You MUST issue the next body command. The sim will EXECUTE your move in the world.
Reply with ONLY JSON:
{"goal":"short aim","move":"left|right|up|down|upleft|upright|downleft|downright|toward|away|idle","steps":1-8,"say":"spoken words max 14 words or \\"\\"","mood":"idle|think|happy|wave|curious","speed":0.5-1.6}

Rules:
- "move"+"steps" is how your body walks THIS turn. steps= how far (1 small, 8 long).
- toward/away are relative to ${other.name} and resolve in the environment.
- If you hit a wall last turn, pick a different move.
- Interact with ${other.name}: approach, flee, circle, talk.
- "say" is the only public chat. Speak when it matters (often when CLOSE).
- Stay in character as ${agent.name}. Always choose a move (or idle).`;
    }

    /** Physics: only executes LLM intent; walls/bumps report back as env events */
    function simulate(agent, dt) {
      const intent = agent.intent;
      if (!intent || intent.remaining <= 0 || (intent.vx === 0 && intent.vy === 0)) {
        agent.el.classList.remove("walk");
        return;
      }

      agent.el.classList.add("walk");
      const sp = MOVE_SPEED * agent.speedMul;
      const step = Math.min(intent.remaining, sp * dt);
      let nx = agent.x + intent.vx * step;
      let ny = agent.y + intent.vy * step;
      const { w, h } = stageSize();

      let hit = null;
      if (nx <= PAD) { nx = PAD; hit = "hit west wall — movement stopped"; }
      else if (nx >= w - PAD) { nx = w - PAD; hit = "hit east wall — movement stopped"; }
      if (ny <= PAD) { ny = PAD; hit = hit || "hit north wall — movement stopped"; }
      else if (ny >= h - PAD) { ny = h - PAD; hit = hit || "hit south wall — movement stopped"; }

      // collision with other sprite
      const other = otherOf(agent);
      const d = Math.hypot(nx - other.x, ny - other.y);
      if (d < 30 && d > 0.01) {
        const push = (30 - d) / d;
        nx += (nx - other.x) * push * 0.6;
        ny += (ny - other.y) * push * 0.6;
        // if still closing into them while moving toward, stop intent
        const closing =
          (intent.vx * (other.x - agent.x) + intent.vy * (other.y - agent.y)) > 0;
        if (closing && d < 32) {
          haltIntent(agent, `bumped into ${other.name} — movement stopped`);
          place(agent, nx, ny);
          return;
        }
      }

      if (hit) {
        place(agent, nx, ny);
        haltIntent(agent, hit);
        return;
      }

      intent.remaining = Math.max(0, intent.remaining - step);
      place(agent, nx, ny);
      if (intent.remaining <= 0) {
        agent.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
        agent.move = "idle";
        agent.el.classList.remove("walk");
        pushEnv(agent, "finished move steps — now idle in place");
      }
    }

    function tick(now) {
      if (!lastFrame) lastFrame = now;
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      if (running && engine) {
        // Only simulate once the LLM is online — bodies wait frozen until then
        for (const agent of agents) simulate(agent, dt);
      }

      requestAnimationFrame(tick);
    }

    function waitUntilIdleOrTimeout(agent, maxMs = 2800) {
      const start = performance.now();
      return new Promise((resolve) => {
        function check() {
          const busy = agent.intent && agent.intent.remaining > 0;
          if (!busy || performance.now() - start > maxMs) return resolve();
          requestAnimationFrame(check);
        }
        check();
      });
    }

    async function think(agent) {
      if (!engine || !running) return;
      // let previous LLM move mostly finish so position feedback is real
      await waitUntilIdleOrTimeout(agent, 2200);

      agent.ticks += 1;
      setMood(agent, "think");

      try {
        const other = otherOf(agent);
        const d = Math.round(dist(agent, other));
        const messages = [
          { role: "system", content: systemPrompt(agent) },
          {
            role: "user",
            content:
              agent.ticks === 1
                ? `You woke in the environment. Issue your first MOVE command (and maybe say hi to ${other.name}).`
                : `Turn ${agent.ticks}. World updated. Distance to ${other.name}: ${d}px. ` +
                  `Issue the next move the environment should execute.` +
                  (d < NEAR ? " You are CLOSE — interact." : " Far — approach/call/or explore."),
          },
        ];

        const reply = await engine.chat.completions.create({
          messages,
          temperature: 0.95,
          max_tokens: 120,
        });

        const content = reply?.choices?.[0]?.message?.content || "";
        const action = parseAction(content);
        if (running) applyAction(agent, action);

        setStatus(
          `${agent.name} → ${agent.move}×${action.steps ?? "?"} @ (${Math.round(agent.x)},${Math.round(agent.y)})`,
          ""
        );
      } catch (err) {
        console.error(agent.name, err);
        // on failure: do NOT random-walk; stay put and note env
        haltIntent(agent, "brain error — stayed put");
        setStatus(`${agent.name} glitch`, "warn");
      }
    }

    async function dualLoop() {
      let i = 0;
      while (running && engine) {
        const agent = agents[i % agents.length];
        await think(agent);
        i += 1;
        // small gap so both agents' moves can play out in the world
        await new Promise((r) => setTimeout(r, 200));
      }
    }

    async function boot() {
      if (engine) return;

      if (!navigator.gpu) {
        setStatus("needs WebGPU — click to retry", "err");
        return;
      }

      progressEl.style.display = "block";
      progressBar.style.width = "0%";
      setStatus("loading mind…", "warn");

      const initProgressCallback = (report) => {
        const p = Math.round((report.progress || 0) * 100);
        progressBar.style.width = `${p}%`;
        setStatus(`loading ${p}%`, "warn");
      };

      let lastErr = null;
      for (const model of MODELS) {
        try {
          engine = await CreateMLCEngine(model, { initProgressCallback });
          progressBar.style.width = "100%";
          setTimeout(() => { progressEl.style.display = "none"; }, 400);
          setMood(bit, "curious");
          setMood(nox, "curious");
          say(bit, "hey… is someone else here?");
          say(nox, "ugh. company.");
          setStatus("LLM driving movement", "");
          setTimeout(() => { statusEl.style.opacity = "0.35"; }, 3000);
          dualLoop();
          return;
        } catch (err) {
          console.warn(model, err);
          lastErr = err;
          engine = null;
        }
      }

      progressEl.style.display = "none";
      setStatus(`failed — click to retry`, "err");
    }

    function layout() {
      const { w, h } = stageSize();
      place(bit, w * 0.35, h * 0.5);
      place(nox, w * 0.65, h * 0.5);
      // frozen until LLM issues first intents
      bit.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
      nox.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
      bit.el.classList.remove("walk");
      nox.el.classList.remove("walk");
    }

    layout();
    requestAnimationFrame(tick);

    window.addEventListener("resize", () => {
      place(bit, bit.x, bit.y);
      place(nox, nox.x, nox.y);
    });
    statusEl.addEventListener("click", () => {
      if (statusEl.classList.contains("err")) boot();
    });

    boot();
  </script>
</body>
</html>
