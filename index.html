<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout · VLA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      font-family: "Courier New", ui-monospace, monospace;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    /* Hidden canvas used as the VLA camera (what the model sees) */
    #vision {
      position: fixed;
      right: 10px;
      top: 10px;
      width: 160px;
      height: 100px;
      border: 1px solid #222;
      image-rendering: pixelated;
      opacity: 0.85;
      z-index: 30;
      background: #000;
      pointer-events: none;
    }

    #vision-label {
      position: fixed;
      right: 10px;
      top: 114px;
      width: 160px;
      text-align: center;
      color: #333;
      font-size: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .sprite {
      position: absolute;
      width: 32px;
      height: 40px;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
      z-index: 2;
      will-change: left, top;
    }

    .sprite.flip { transform: translate(-50%, -50%) scaleX(-1); }

    .sprite .body {
      position: absolute;
      inset: 8px 6px 4px;
      border-radius: 4px 4px 2px 2px;
      transition: background 0.25s, box-shadow 0.25s;
    }

    .sprite .head {
      position: absolute;
      top: 0;
      left: 8px;
      width: 16px;
      height: 14px;
      border-radius: 3px;
    }

    .sprite .eye {
      position: absolute;
      top: 5px;
      width: 3px;
      height: 3px;
      background: #111;
      border-radius: 1px;
    }

    .sprite .eye.l { left: 10px; }
    .sprite .eye.r { left: 19px; }

    .sprite .leg {
      position: absolute;
      bottom: 0;
      width: 5px;
      height: 8px;
      border-radius: 1px;
    }

    .sprite .leg.l { left: 9px; }
    .sprite .leg.r { right: 9px; }

    .sprite.walk .leg.l { animation: step 0.16s infinite alternate; }
    .sprite.walk .leg.r { animation: step 0.16s infinite alternate-reverse; }

    @keyframes step {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    .sprite.bit .body {
      background: #6ec6ff;
      box-shadow: 0 0 14px rgba(110, 198, 255, 0.4);
    }
    .sprite.bit .head { background: #b8e4ff; }
    .sprite.bit .leg { background: #3a8fc4; }
    .sprite.bit.think .body { background: #c9a0ff; box-shadow: 0 0 14px rgba(201, 160, 255, 0.45); }
    .sprite.bit.happy .body { background: #7dffb3; box-shadow: 0 0 14px rgba(125, 255, 179, 0.45); }
    .sprite.bit.curious .body { background: #ffe08a; box-shadow: 0 0 14px rgba(255, 224, 138, 0.4); }

    .sprite.nox .body {
      background: #ff7a6e;
      box-shadow: 0 0 14px rgba(255, 122, 110, 0.4);
    }
    .sprite.nox .head { background: #ffc4bc; }
    .sprite.nox .leg { background: #c44a40; }
    .sprite.nox.think .body { background: #d4a0ff; box-shadow: 0 0 14px rgba(212, 160, 255, 0.45); }
    .sprite.nox.happy .body { background: #ffb347; box-shadow: 0 0 14px rgba(255, 179, 71, 0.45); }
    .sprite.nox.curious .body { background: #ff9ecd; box-shadow: 0 0 14px rgba(255, 158, 205, 0.4); }

    .sprite.wave .head { animation: bob 0.4s ease 2; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    #chatlog {
      position: fixed;
      left: 8px;
      bottom: 12px;
      width: min(440px, calc(100vw - 16px));
      max-height: min(260px, 40vh);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 2px;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    #chatlog .line {
      padding: 3px 6px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 13px;
      line-height: 1.35;
      text-shadow: 1px 1px 0 #000;
      word-break: break-word;
      opacity: 1;
      transition: opacity 1.2s ease;
    }

    #chatlog .line.fade { opacity: 0; }
    #chatlog .line .bit { color: #55ffff; }
    #chatlog .line .nox { color: #ff5555; }

    #status {
      position: fixed;
      left: 10px;
      top: 10px;
      color: #333;
      font-size: 11px;
      z-index: 10;
      max-width: calc(100vw - 200px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #status.err {
      color: #a44;
      pointer-events: auto;
      cursor: pointer;
    }

    #status.warn { color: #886622; }

    #progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      display: none;
      z-index: 11;
    }

    #progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: #2a5a7a;
      transition: width 0.15s linear;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="sprite bit" id="sprite-bit" aria-label="Bit">
      <div class="head"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="body"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
    <div class="sprite nox" id="sprite-nox" aria-label="Nox">
      <div class="head"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="body"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
  </div>

  <!-- Live VLA camera feed (what the model is seeing) -->
  <canvas id="vision" width="320" height="200" aria-label="VLA vision feed"></canvas>
  <div id="vision-label">VLA eye · SmolVLM</div>

  <div id="chatlog" aria-label="chat log"></div>
  <div id="status">booting VLA…</div>
  <div id="progress"><i></i></div>

  <script type="module">
    /**
     * In-browser Vision-Language-Action loop:
     *   1. Render environment frame (camera)
     *   2. SmolVLM sees the frame + instruction
     *   3. Model outputs action JSON
     *   4. Environment executes move
     *
     * Uses HuggingFaceTB/SmolVLM-256M-Instruct via transformers.js + WebGPU.
     * (Full robotics SmolVLA weights aren't browser-packaged; this is the
     *  same V→L→A control loop with a browser-runnable VLM action head.)
     */
    import {
      AutoProcessor,
      AutoModelForVision2Seq,
      RawImage,
    } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

    const MODEL_ID = "HuggingFaceTB/SmolVLM-256M-Instruct";
    const STEP_PX = 44;
    const MOVE_SPEED = 115;
    const NEAR = 90;
    const PAD = 28;
    const CHAT_MAX = 16;
    const CHAT_FADE_MS = 14000;
    const CHAT_REMOVE_MS = 16000;
    const VISION_W = 320;
    const VISION_H = 200;

    const DIRS = {
      left:      { vx: -1, vy:  0 },
      right:     { vx:  1, vy:  0 },
      up:        { vx:  0, vy: -1 },
      down:      { vx:  0, vy:  1 },
      upleft:    { vx: -0.707, vy: -0.707 },
      upright:   { vx:  0.707, vy: -0.707 },
      downleft:  { vx: -0.707, vy:  0.707 },
      downright: { vx:  0.707, vy:  0.707 },
    };

    const stage = document.getElementById("stage");
    const chatlog = document.getElementById("chatlog");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const progressBar = progressEl.querySelector("i");
    const visionCanvas = document.getElementById("vision");
    const visionCtx = visionCanvas.getContext("2d");
    const visionLabel = document.getElementById("vision-label");

    let processor = null;
    let model = null;
    let running = true;
    let lastFrame = 0;
    const transcript = [];

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function logSpeech(name, text, cssClass) {
      const msg = String(text || "").trim();
      if (!msg) return;
      transcript.push({ name, text: msg, t: Date.now() });
      if (transcript.length > 12) transcript.shift();
      const line = document.createElement("div");
      line.className = "line";
      line.innerHTML =
        `<span class="${cssClass}">&lt;${escapeHtml(name)}&gt;</span> ${escapeHtml(msg)}`;
      chatlog.appendChild(line);
      while (chatlog.children.length > CHAT_MAX) chatlog.removeChild(chatlog.firstChild);
      setTimeout(() => line.classList.add("fade"), CHAT_FADE_MS);
      setTimeout(() => line.remove(), CHAT_REMOVE_MS);
    }

    function stageSize() {
      return { w: stage.clientWidth, h: stage.clientHeight };
    }

    function createAgent(cfg) {
      return {
        id: cfg.id,
        name: cfg.name,
        cssClass: cfg.cssClass,
        color: cfg.color,
        persona: cfg.persona,
        el: document.getElementById(cfg.elId),
        x: 0,
        y: 0,
        intent: { vx: 0, vy: 0, remaining: 0, label: "idle" },
        move: "idle",
        mood: "curious",
        goal: cfg.goal0,
        lastSaid: "",
        speedMul: 1,
        facing: 1,
        ticks: 0,
        memory: [],
        envEvents: [],
        lastSaw: "",
      };
    }

    const bit = createAgent({
      id: "bit",
      name: "Bit",
      elId: "sprite-bit",
      cssClass: "bit",
      color: "#6ec6ff",
      persona: "optimistic cyan glitch who likes company",
      goal0: "find the other spark",
    });

    const nox = createAgent({
      id: "nox",
      name: "Nox",
      elId: "sprite-nox",
      cssClass: "nox",
      color: "#ff7a6e",
      persona: "dry coral glitch who teases but sticks around",
      goal0: "circle Bit without admitting it",
    });

    const agents = [bit, nox];

    function otherOf(a) {
      return a === bit ? nox : bit;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function place(agent, x, y) {
      const { w, h } = stageSize();
      x = Math.max(PAD, Math.min(w - PAD, x));
      y = Math.max(PAD, Math.min(h - PAD, y));
      agent.x = x;
      agent.y = y;
      agent.el.style.left = `${x}px`;
      agent.el.style.top = `${y}px`;
    }

    function setFacing(agent, dir) {
      agent.facing = dir;
      agent.el.classList.toggle("flip", dir < 0);
    }

    function setMood(agent, mood) {
      agent.el.classList.remove("think", "happy", "wave", "curious");
      agent.mood = mood || "idle";
      if (["think", "happy", "wave", "curious"].includes(mood)) {
        agent.el.classList.add(mood);
      }
      if (mood === "happy" || mood === "wave") agent.speedMul = 1.2;
      else if (mood === "think") agent.speedMul = 0.75;
      else if (mood === "curious") agent.speedMul = 1.05;
      else agent.speedMul = 1;
    }

    function pushEnv(agent, event) {
      agent.envEvents.push(event);
      if (agent.envEvents.length > 5) agent.envEvents.shift();
    }

    function resolveDir(agent, name) {
      let dir = String(name || "idle").toLowerCase().replace(/[_\s-]/g, "");
      if (["none", "stop", "stay", "idle"].includes(dir)) {
        return { dir: "idle", vx: 0, vy: 0 };
      }
      const o = otherOf(agent);
      if (dir === "toward" || dir === "approach") {
        const dx = o.x - agent.x;
        const dy = o.y - agent.y;
        if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return { dir: "idle", vx: 0, vy: 0 };
        if (Math.abs(dx) > 20 && Math.abs(dy) > 20) {
          const hs = dx >= 0 ? "right" : "left";
          const vs = dy >= 0 ? "down" : "up";
          dir = (vs === "up" ? "up" : "down") + hs;
        } else if (Math.abs(dx) >= Math.abs(dy)) dir = dx >= 0 ? "right" : "left";
        else dir = dy >= 0 ? "down" : "up";
      } else if (dir === "away" || dir === "flee") {
        const dx = agent.x - o.x;
        const dy = agent.y - o.y;
        if (Math.abs(dx) > 20 && Math.abs(dy) > 20) {
          const hs = dx >= 0 ? "right" : "left";
          const vs = dy >= 0 ? "down" : "up";
          dir = (vs === "up" ? "up" : "down") + hs;
        } else if (Math.abs(dx) >= Math.abs(dy)) dir = dx >= 0 ? "right" : "left";
        else dir = dy >= 0 ? "down" : "up";
      }
      if (!DIRS[dir]) return { dir: "idle", vx: 0, vy: 0 };
      return { dir, vx: DIRS[dir].vx, vy: DIRS[dir].vy };
    }

    function issueMove(agent, moveName, steps = 3) {
      const n = Math.max(0, Math.min(8, Number(steps) || 0));
      const { dir, vx, vy } = resolveDir(agent, moveName);
      agent.move = dir;
      if (dir === "idle" || n === 0) {
        agent.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
        agent.el.classList.remove("walk");
        return;
      }
      agent.intent = { vx, vy, remaining: n * STEP_PX, label: dir };
      if (Math.abs(vx) > 0.01) setFacing(agent, vx > 0 ? 1 : -1);
      agent.el.classList.add("walk");
    }

    function haltIntent(agent, reason) {
      if (agent.intent.remaining > 0 || agent.intent.label !== "idle") {
        pushEnv(agent, reason);
      }
      agent.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
      agent.move = "idle";
      agent.el.classList.remove("walk");
    }

    function say(agent, text) {
      const msg = String(text || "").trim();
      if (!msg) return;
      agent.lastSaid = msg.slice(0, 120);
      logSpeech(agent.name, agent.lastSaid, agent.cssClass);
    }

    function remember(agent, line) {
      agent.memory.push(line);
      if (agent.memory.length > 5) agent.memory.shift();
    }

    function applyAction(agent, action) {
      if (!action || typeof action !== "object") return;
      if (action.goal) agent.goal = String(action.goal).slice(0, 80);
      if (action.mood) setMood(agent, String(action.mood).toLowerCase());
      if (typeof action.speed === "number") {
        agent.speedMul = Math.max(0.45, Math.min(1.8, action.speed));
      }
      // optional: model narrates what it saw
      if (action.see) agent.lastSaw = String(action.see).slice(0, 100);

      const move = action.move != null ? action.move : "idle";
      const steps = action.steps != null ? action.steps : 3;
      issueMove(agent, move, steps);
      if (action.say) say(agent, action.say);

      remember(agent, `VLA move=${agent.move} steps=${steps}` +
        (action.say ? ` “${String(action.say).slice(0, 30)}”` : ""));
    }

    function parseAction(raw) {
      if (!raw) return { move: "idle", steps: 0, say: "" };
      let t = raw.trim();
      // strip assistant preamble if present
      const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fence) t = fence[1].trim();
      const brace = t.match(/\{[\s\S]*\}/);
      if (brace) t = brace[0];
      try {
        const obj = JSON.parse(t);
        if (obj.move == null) obj.move = "idle";
        if (obj.steps == null) obj.steps = 3;
        return obj;
      } catch {
        const lower = raw.toLowerCase();
        let move = "idle";
        if (lower.includes("toward") || lower.includes("approach")) move = "toward";
        else if (lower.includes("away") || lower.includes("flee")) move = "away";
        else if (lower.includes("left")) move = "left";
        else if (lower.includes("right")) move = "right";
        else if (lower.includes("up")) move = "up";
        else if (lower.includes("down")) move = "down";
        return { move, steps: 3, say: "", mood: "curious" };
      }
    }

    // ── Vision camera: paint what the VLA "sees" ──────────────
    function captureFrame(agent) {
      const { w, h } = stageSize();
      const other = otherOf(agent);
      const ctx = visionCtx;
      const cw = VISION_W;
      const ch = VISION_H;
      visionCanvas.width = cw;
      visionCanvas.height = ch;

      // black void
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, cw, ch);

      // wall border (visible environment bounds)
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, cw - 4, ch - 4);

      // map world → camera
      const sx = (cw - 16) / w;
      const sy = (ch - 16) / h;
      const mapX = (x) => 8 + x * sx;
      const mapY = (y) => 8 + y * sy;

      // faint grid so spatial structure is visible to the VLM
      ctx.strokeStyle = "#151515";
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const gx = (cw * i) / 4;
        const gy = (ch * i) / 4;
        ctx.beginPath();
        ctx.moveTo(gx, 8);
        ctx.lineTo(gx, ch - 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(8, gy);
        ctx.lineTo(cw - 8, gy);
        ctx.stroke();
      }

      function drawEntity(a, isSelf) {
        const x = mapX(a.x);
        const y = mapY(a.y);
        const size = isSelf ? 18 : 16;

        // body
        ctx.fillStyle = a.color;
        ctx.fillRect(x - size / 2, y - size / 2, size, size);

        // direction tick (shows facing / last intent)
        const d = DIRS[a.move] || { vx: a.facing, vy: 0 };
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + d.vx * 14, y + d.vy * 14);
        ctx.stroke();

        // label
        ctx.font = "bold 11px monospace";
        ctx.fillStyle = isSelf ? "#ffff55" : "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText(isSelf ? `YOU:${a.name}` : a.name, x, y - size / 2 - 4);
      }

      drawEntity(other, false);
      drawEntity(agent, true);

      // proximity ring when close
      if (dist(agent, other) < NEAR) {
        const x = mapX(agent.x);
        const y = mapY(agent.y);
        ctx.strokeStyle = "#55ff55";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.stroke();
      }

      // HUD strip on frame
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, ch - 18, cw, 18);
      ctx.fillStyle = "#aaa";
      ctx.font = "10px monospace";
      ctx.textAlign = "left";
      ctx.fillText(
        `${agent.name} cam  d=${Math.round(dist(agent, other))}  ${agent.move}`,
        6,
        ch - 5
      );

      visionLabel.textContent = `VLA eye · ${agent.name} seeing`;

      // return as data URL for the model
      return visionCanvas.toDataURL("image/png");
    }

    function vlaPrompt(agent) {
      const other = otherOf(agent);
      const d = Math.round(dist(agent, other));
      const events = agent.envEvents.length
        ? agent.envEvents.join("; ")
        : "none";
      agent.envEvents = [];

      const chat = transcript
        .slice(-4)
        .map((m) => `<${m.name}> ${m.text}`)
        .join(" | ");

      // Keep prompt short — small VLMs follow short action schemas better
      return (
        `You are ${agent.name}, a sprite in a top-down black room. ` +
        `The image is YOUR camera: yellow YOU:${agent.name} is you, the other colored square is ${other.name}. ` +
        `White tick = facing. Green ring = close. Gray border = walls.\n` +
        `State: dist_to_${other.name}=${d}px, last_move=${agent.move}, goal=${agent.goal}, events=${events}. ` +
        `Recent talk: ${chat || "silence"}.\n` +
        `Persona: ${agent.persona}.\n` +
        `Look at the image. Choose ONE action. Reply with ONLY JSON, no markdown:\n` +
        `{"see":"brief what you see","move":"left|right|up|down|upleft|upright|downleft|downright|toward|away|idle","steps":1-6,"say":"max 12 words or empty","mood":"idle|think|happy|curious","goal":"short"}`
      );
    }

    async function vlaInfer(agent) {
      const dataUrl = captureFrame(agent);
      const image = await RawImage.fromURL(dataUrl);
      const prompt = vlaPrompt(agent);

      const messages = [
        {
          role: "user",
          content: [
            { type: "image" },
            { type: "text", text: prompt },
          ],
        },
      ];

      const text = processor.apply_chat_template(messages, {
        add_generation_prompt: true,
      });

      const inputs = await processor(text, [image], {
        // keep memory light for dual-agent loop
      });

      const outputs = await model.generate({
        ...inputs,
        max_new_tokens: 96,
        do_sample: true,
        temperature: 0.7,
        top_p: 0.9,
      });

      // Decode only the newly generated tokens when possible
      const decoded = processor.batch_decode(outputs, {
        skip_special_tokens: true,
      });
      let raw = decoded[0] || "";
      // strip any echoed prompt / role tags
      const asst = raw.split("Assistant:").pop() || raw;
      const lastBrace = asst.includes("{") ? asst.slice(asst.indexOf("{")) : asst;
      return lastBrace.trim();
    }

    function simulate(agent, dt) {
      const intent = agent.intent;
      if (!intent || intent.remaining <= 0 || (intent.vx === 0 && intent.vy === 0)) {
        agent.el.classList.remove("walk");
        return;
      }
      agent.el.classList.add("walk");
      const sp = MOVE_SPEED * agent.speedMul;
      const step = Math.min(intent.remaining, sp * dt);
      let nx = agent.x + intent.vx * step;
      let ny = agent.y + intent.vy * step;
      const { w, h } = stageSize();

      let hit = null;
      if (nx <= PAD) { nx = PAD; hit = "hit west wall"; }
      else if (nx >= w - PAD) { nx = w - PAD; hit = "hit east wall"; }
      if (ny <= PAD) { ny = PAD; hit = hit || "hit north wall"; }
      else if (ny >= h - PAD) { ny = h - PAD; hit = hit || "hit south wall"; }

      const other = otherOf(agent);
      const d = Math.hypot(nx - other.x, ny - other.y);
      if (d < 30 && d > 0.01) {
        const push = (30 - d) / d;
        nx += (nx - other.x) * push * 0.6;
        ny += (ny - other.y) * push * 0.6;
        const closing =
          intent.vx * (other.x - agent.x) + intent.vy * (other.y - agent.y) > 0;
        if (closing && d < 32) {
          haltIntent(agent, `bumped ${other.name}`);
          place(agent, nx, ny);
          return;
        }
      }

      if (hit) {
        place(agent, nx, ny);
        haltIntent(agent, hit);
        return;
      }

      intent.remaining = Math.max(0, intent.remaining - step);
      place(agent, nx, ny);
      if (intent.remaining <= 0) {
        agent.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
        agent.move = "idle";
        agent.el.classList.remove("walk");
        pushEnv(agent, "finished steps");
      }
    }

    function tick(now) {
      if (!lastFrame) lastFrame = now;
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      if (running && model) {
        for (const a of agents) simulate(a, dt);
      }
      requestAnimationFrame(tick);
    }

    function waitUntilIdleOrTimeout(agent, maxMs = 2400) {
      const start = performance.now();
      return new Promise((resolve) => {
        (function check() {
          const busy = agent.intent && agent.intent.remaining > 0;
          if (!busy || performance.now() - start > maxMs) return resolve();
          requestAnimationFrame(check);
        })();
      });
    }

    async function think(agent) {
      if (!model || !running) return;
      await waitUntilIdleOrTimeout(agent, 2200);
      agent.ticks += 1;
      setMood(agent, "think");
      setStatus(`${agent.name} · VLA seeing…`, "warn");

      try {
        const raw = await vlaInfer(agent);
        const action = parseAction(raw);
        if (running) applyAction(agent, action);
        setStatus(
          `${agent.name} · saw→${(action.see || "…").toString().slice(0, 28)} · ${agent.move}`,
          ""
        );
      } catch (err) {
        console.error(agent.name, err);
        haltIntent(agent, "vision error");
        setStatus(`${agent.name} VLA glitch: ${err.message || err}`, "warn");
      }
    }

    async function dualLoop() {
      let i = 0;
      while (running && model) {
        await think(agents[i % agents.length]);
        i += 1;
        await new Promise((r) => setTimeout(r, 150));
      }
    }

    async function boot() {
      if (model) return;

      if (!navigator.gpu) {
        setStatus("needs WebGPU (Chrome/Edge) — click to retry", "err");
        return;
      }

      progressEl.style.display = "block";
      progressBar.style.width = "0%";
      setStatus("loading SmolVLM (VLA eye)…", "warn");

      try {
        processor = await AutoProcessor.from_pretrained(MODEL_ID, {
          progress_callback: (p) => {
            if (p?.progress != null) {
              const pct = Math.round(p.progress * 100);
              progressBar.style.width = `${Math.min(50, pct / 2)}%`;
              setStatus(`processor ${pct}%`, "warn");
            }
          },
        });

        model = await AutoModelForVision2Seq.from_pretrained(MODEL_ID, {
          dtype: "fp32",
          device: "webgpu",
          progress_callback: (p) => {
            if (p?.progress != null) {
              const pct = Math.round(p.progress * 100);
              progressBar.style.width = `${50 + pct / 2}%`;
              setStatus(`SmolVLM weights ${pct}%`, "warn");
            }
          },
        });

        progressBar.style.width = "100%";
        setTimeout(() => { progressEl.style.display = "none"; }, 400);

        setMood(bit, "curious");
        setMood(nox, "curious");
        // seed chat once online
        say(bit, "i can see you…");
        say(nox, "don't stare.");
        setStatus("VLA online · vision + action loop", "");
        setTimeout(() => { if (!statusEl.classList.contains("err")) statusEl.style.opacity = "0.4"; }, 4000);
        dualLoop();
      } catch (err) {
        console.error(err);
        model = null;
        processor = null;
        progressEl.style.display = "none";
        setStatus(`VLA load failed — click to retry (${err.message || err})`, "err");
      }
    }

    function layout() {
      const { w, h } = stageSize();
      place(bit, w * 0.35, h * 0.5);
      place(nox, w * 0.65, h * 0.5);
      bit.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
      nox.intent = { vx: 0, vy: 0, remaining: 0, label: "idle" };
      // initial camera paint
      captureFrame(bit);
    }

    layout();
    requestAnimationFrame(tick);
    window.addEventListener("resize", () => {
      place(bit, bit.x, bit.y);
      place(nox, nox.x, nox.y);
    });
    statusEl.addEventListener("click", () => {
      if (statusEl.classList.contains("err")) boot();
    });

    boot();
  </script>
</body>
</html>
