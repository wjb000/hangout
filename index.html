<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout</title>
  <link rel="stylesheet" href="styles.css?v=5" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.2/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="viewport"></div>
  <div id="crosshair">+</div>

  <header id="top">
    <div class="brand">hangout</div>
    <button type="button" id="who" title="Change name">you</button>
    <span id="link" class="dim">finding people…</span>
  </header>

  <ul id="pills"></ul>
  <div id="toast"></div>

  <div id="chat" class="idle">
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" maxlength="160" placeholder="Say something" autocomplete="off" />
    </form>
  </div>

  <p id="hint">click the world to look around · wasd</p>

  <script type="module" src="lobby.js?v=5"></script>
</body>
</html>
