<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hangout</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#08060c;color:#f4efe8;font-family:ui-sans-serif,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#ui button{pointer-events:auto;border:1px solid rgba(255,255,255,.14);background:rgba(12,8,18,.72);color:#fff;backdrop-filter:blur(14px);border-radius:999px;padding:7px 13px;cursor:pointer;font:12px inherit}
#top{position:absolute;top:16px;left:18px;display:flex;gap:10px;align-items:center}
.brand{letter-spacing:.32em;font-size:11px;text-transform:uppercase;opacity:.5;pointer-events:none}
#cast{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#hint{position:absolute;bottom:66px;width:100%;text-align:center;font-size:12px;color:rgba(244,239,232,.5);pointer-events:none}
#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(12,8,18,.75);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
<script type="importmap">{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.min.js"
  }
}</script>
</head>
<body>
<div id="ui">
  <div id="top"><div class="brand">hangout</div><button id="who" type="button">you</button></div>
  <div id="toast"></div>
  <div id="hint">hold drag to look · WASD walk · shift run · scroll zoom</div>
  <div id="cast">
    <button data-id="aya">Aya</button>
    <button data-id="haru">Haru</button>
    <button data-id="ren">Ren</button>
    <button data-id="robot">Robot</button>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* Retarget from pixiv/three-vrm humanoidAnimation example.
   Clips from readyplayerme/animation-library (Mixamo). */
const MIXAMO = {
  mixamorigHips:"hips", mixamorigSpine:"spine", mixamorigSpine1:"chest", mixamorigSpine2:"upperChest",
  mixamorigNeck:"neck", mixamorigHead:"head",
  mixamorigLeftShoulder:"leftShoulder", mixamorigLeftArm:"leftUpperArm", mixamorigLeftForeArm:"leftLowerArm", mixamorigLeftHand:"leftHand",
  mixamorigRightShoulder:"rightShoulder", mixamorigRightArm:"rightUpperArm", mixamorigRightForeArm:"rightLowerArm", mixamorigRightHand:"rightHand",
  mixamorigLeftUpLeg:"leftUpperLeg", mixamorigLeftLeg:"leftLowerLeg", mixamorigLeftFoot:"leftFoot", mixamorigLeftToeBase:"leftToes",
  mixamorigRightUpLeg:"rightUpperLeg", mixamorigRightLeg:"rightLowerLeg", mixamorigRightFoot:"rightFoot", mixamorigRightToeBase:"rightToes",
};
const MOTION = {
  idle: "https://cdn.jsdelivr.net/gh/readyplayerme/animation-library@master/feminine/fbx/idle/F_Standing_Idle_001.fbx",
  walk: "https://cdn.jsdelivr.net/gh/readyplayerme/animation-library@master/feminine/fbx/locomotion/F_Walk_002.fbx",
  run:  "https://cdn.jsdelivr.net/gh/readyplayerme/animation-library@master/feminine/fbx/locomotion/F_Run_001.fbx",
};
const CAST = {
  aya:  { vrm: true, url: "https://cdn.jsdelivr.net/gh/madjin/vrm-samples@master/vroid/stable/AvatarSample_A.vrm" },
  haru: { vrm: true, url: "https://cdn.jsdelivr.net/gh/madjin/vrm-samples@master/vroid/stable/AvatarSample_B.vrm" },
  ren:  { vrm: true, url: "https://cdn.jsdelivr.net/gh/madjin/vrm-samples@master/vroid/stable/AvatarSample_C.vrm" },
  robot:{ vrm: false, url: "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb" },
};

const toastEl = document.getElementById("toast");
function toast(t){ toastEl.textContent = t; toastEl.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => toastEl.classList.remove("on"), 1800); }
function shortest(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function rot(n, x, y, z) { if (n) n.rotation.set(x, y, z); }

const keys = Object.create(null);
let yaw = 0.2, pitch = 0.18, dist = 3.6;
let x = 0, z = 3.2, facing = Math.PI, shown = Math.PI, dragging = false;
let vx = 0, vz = 0, phase = 0, blink = 0, hasClips = false;
let actor = null, mixer = null, vrm = null, vrmMod = null, faceOff = 0;
const cam = { x: 0, y: 2, z: 6 };
const ROOM = { minX: -7.2, maxX: 7.2, minZ: -5.4, maxZ: 5.4 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09070f);
scene.fog = new THREE.Fog(0x09070f, 16, 28);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.08, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

function mat(c, extra = {}) {
  return new THREE.MeshStandardMaterial({ color: c, roughness: 0.62, metalness: 0.08, ...extra });
}
function box(w, h, d, c, px, py, pz, extra) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, extra));
  m.position.set(px, py, pz); scene.add(m); return m;
}
function neon(w, h, d, c, px, py, pz) {
  return box(w, h, d, c, px, py, pz, { emissive: c, emissiveIntensity: 3.2, roughness: 0.2 });
}

box(16, 0.08, 12, 0x2a1c22, 0, 0, 0, { roughness: 0.35, metalness: 0.25 });
const dance = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 5.2, 8, 8), new THREE.MeshStandardMaterial({
  color: 0x1a1020, emissive: 0x3a1060, emissiveIntensity: 0.35, roughness: 0.3, metalness: 0.4
}));
dance.rotation.x = -Math.PI / 2; dance.position.set(0, 0.045, 0.4); scene.add(dance);
box(16.2, 4.4, 0.18, 0x140e16, 0, 2.2, -6);
box(16.2, 4.4, 0.18, 0x140e16, 0, 2.2, 6);
box(0.18, 4.4, 12.2, 0x140e16, -8, 2.2, 0);
box(0.18, 4.4, 12.2, 0x140e16, 8, 2.2, 0);
box(16.4, 0.16, 12.4, 0x0c0a10, 0, 4.4, 0);
neon(10, 0.04, 0.04, 0xff4d8d, 0, 3.55, -5.88);
neon(10, 0.04, 0.04, 0x49e0ff, 0, 3.55, 5.88);
neon(0.04, 0.04, 8, 0xff4d8d, -7.88, 3.55, 0);
neon(0.04, 0.04, 8, 0x49e0ff, 7.88, 3.55, 0);
box(8.4, 1.05, 1.3, 0x1a1218, 0, 0.52, -5.15, { roughness: 0.4, metalness: 0.2 });
box(8.5, 0.08, 1.45, 0x3a2a28, 0, 1.08, -5.15, { roughness: 0.25, metalness: 0.35 });
neon(7.6, 0.03, 0.03, 0xffb24d, 0, 1.14, -4.52);
for (let i = -3; i <= 3; i++) box(0.32, 0.78, 0.32, 0x111016, i * 1.05, 1.5, -5.35, { emissive: 0xff8844, emissiveIntensity: 0.25 });
box(4.2, 0.18, 2.4, 0x1c1420, 0, 0.12, -3.2);
box(3.6, 0.55, 0.18, 0x120c16, -5.4, 0.4, 3.6);
box(3.6, 0.55, 0.18, 0x120c16, 5.4, 0.4, 3.6);
box(1.4, 0.42, 0.7, 0x2a1c28, -5.4, 0.55, 3.1);
box(1.4, 0.42, 0.7, 0x2a1c28, 5.4, 0.55, 3.1);
box(0.06, 2.2, 3.4, 0x6ec8ff, -7.86, 2.15, 0, { emissive: 0x3a80ff, emissiveIntensity: 1.4, roughness: 0.15 });
box(0.06, 2.2, 3.4, 0xff7ad1, 7.86, 2.15, 0, { emissive: 0xff3d9a, emissiveIntensity: 1.2, roughness: 0.15 });
box(3.4, 0.55, 0.08, 0xff4d8d, 0, 3.15, -5.86, { emissive: 0xff4d8d, emissiveIntensity: 2.4 });

scene.add(new THREE.HemisphereLight(0xffc8d8, 0x0a0610, 0.55));
const key = new THREE.PointLight(0xff6ea8, 18, 16); key.position.set(0, 3.4, -2); scene.add(key);
const fill = new THREE.PointLight(0x4ad8ff, 14, 14); fill.position.set(-3.5, 3.1, 2.4); scene.add(fill);
const fill2 = new THREE.PointLight(0xffb347, 10, 12); fill2.position.set(3.2, 2.6, -3); scene.add(fill2);
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

function dummy() {
  const g = new THREE.Group();
  const skin = mat(0xffd0c2);
  const shirt = mat(0x67e8ff, { emissive: 0x1a6070, emissiveIntensity: 0.2 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.7, 5, 10), shirt); body.position.y = 1.05;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), skin); head.position.y = 1.62;
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 10), mat(0x2a1020)); hair.position.y = 1.7;
  g.add(body, head, hair); return g;
}
function setActor(mesh, clips, vr) {
  if (actor) scene.remove(actor);
  const rig = new THREE.Group();
  rig.add(mesh);
  actor = rig; scene.add(actor);
  vrm = vr || null;
  faceOff = vr ? Math.PI : 0;
  hasClips = false;
  if (vrm?.lookAt) vrm.lookAt.target = camera;
  mixer = clips && clips.length ? new THREE.AnimationMixer(mesh) : null;
  rig.userData.idle = rig.userData.walk = rig.userData.run = null;
  if (mixer) {
    const idle = clips.find((c) => /idle/i.test(c.name)) || clips[0];
    mixer.clipAction(idle).play();
    rig.userData.idle = mixer.clipAction(idle);
    const w = clips.find((c) => /walk/i.test(c.name));
    const r = clips.find((c) => /run/i.test(c.name));
    rig.userData.walk = w ? mixer.clipAction(w) : null;
    rig.userData.run = r ? mixer.clipAction(r) : null;
    hasClips = !!(rig.userData.walk && !vr);
  }
}
setActor(dummy(), []);

const fbx = new FBXLoader();
const _qA = new THREE.Quaternion();
const restInv = new THREE.Quaternion();
const parentRest = new THREE.Quaternion();
async function mixamoClip(url, vr) {
  const asset = await fbx.loadAsync(url);
  const clip = THREE.AnimationClip.findByName(asset.animations, "mixamo.com") || asset.animations[0];
  if (!clip) return null;
  const tracks = [];
  const v0 = vr.meta?.metaVersion === "0";
  for (const track of clip.tracks) {
    const parts = track.name.split(".");
    const prop = parts.pop();
    const rigName = parts.join(".").split("|").pop();
    const human = MIXAMO[rigName];
    const node = human && vr.humanoid.getNormalizedBoneNode(human);
    const src = asset.getObjectByName(rigName);
    if (!node || !src || prop !== "quaternion") continue;
    if (src.parent) {
      src.getWorldQuaternion(restInv).invert();
      src.parent.getWorldQuaternion(parentRest);
    }
    const values = track.values.slice();
    for (let i = 0; i < values.length; i += 4) {
      _qA.set(values[i], values[i + 1], values[i + 2], values[i + 3]);
      if (src.parent) _qA.premultiply(parentRest).multiply(restInv);
      values[i] = _qA.x; values[i + 1] = _qA.y; values[i + 2] = _qA.z; values[i + 3] = _qA.w;
    }
    if (v0) for (let i = 0; i < values.length; i++) if (i % 2 === 0) values[i] = -values[i];
    tracks.push(new THREE.QuaternionKeyframeTrack(node.name + ".quaternion", track.times, values));
  }
  return tracks.length >= 8 ? new THREE.AnimationClip(url.split("/").pop(), clip.duration, tracks) : null;
}
async function dressMotion(vr, rig) {
  toast("loading motion");
  try {
    const [idle, walk, run] = await Promise.all([
      mixamoClip(MOTION.idle, vr).catch(() => null),
      mixamoClip(MOTION.walk, vr).catch(() => null),
      mixamoClip(MOTION.run, vr).catch(() => null),
    ]);
    mixer = new THREE.AnimationMixer(vr.scene);
    if (idle) rig.userData.idle = mixer.clipAction(idle);
    if (walk) rig.userData.walk = mixer.clipAction(walk);
    if (run) rig.userData.run = mixer.clipAction(run);
    if (rig.userData.idle) rig.userData.idle.play();
    hasClips = !!(rig.userData.walk && rig.userData.idle);
    toast(hasClips ? "clips on" : "using fallback walk");
  } catch (e) {
    hasClips = false;
    toast("using fallback walk");
  }
}

const loader = new GLTFLoader();
async function wear(id) {
  const spec = CAST[id]; if (!spec) return;
  toast("loading " + id);
  if (spec.vrm && !vrmMod) {
    vrmMod = await import("@pixiv/three-vrm");
    loader.register((p) => new vrmMod.VRMLoaderPlugin(p));
  }
  const gltf = await loader.loadAsync(spec.url);
  const vr = gltf.userData && gltf.userData.vrm;
  const root = vr ? vr.scene : gltf.scene;
  root.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  setActor(root, gltf.animations || [], vr);
  if (vr) await dressMotion(vr, actor);
  toast(id);
}

function nbone(name) { return vrm?.humanoid?.getNormalizedBoneNode?.(name) || null; }
function gait(moving, run, step) {
  if (!vrm || hasClips) return;
  if (moving) phase += step * 2.8;
  const p = phase;
  const s = Math.sin(p), o = Math.sin(p + Math.PI);
  const lift = Math.max(0, -Math.cos(p));
  const lift2 = Math.max(0, -Math.cos(p + Math.PI));
  const a = moving ? (run ? 0.4 : 0.26) : 0.01;
  const t = clock.elapsedTime;
  rot(nbone("leftUpperLeg"), s * a, 0, 0);
  rot(nbone("rightUpperLeg"), o * a, 0, 0);
  rot(nbone("leftLowerLeg"), lift * a, 0, 0);
  rot(nbone("rightLowerLeg"), lift2 * a, 0, 0);
  rot(nbone("leftFoot"), moving ? s * 0.06 : 0.03, 0, 0);
  rot(nbone("rightFoot"), moving ? o * 0.06 : 0.03, 0, 0);
  rot(nbone("leftUpperArm"), 0, 0, 1.28 + o * (moving ? 0.16 : 0.02));
  rot(nbone("rightUpperArm"), 0, 0, -1.28 + s * (moving ? 0.16 : 0.02));
  rot(nbone("leftLowerArm"), 0.2, 0, 0);
  rot(nbone("rightLowerArm"), 0.2, 0, 0);
  rot(nbone("hips"), moving ? 0.03 : 0.01, moving ? s * 0.03 : Math.sin(t * 0.8) * 0.01, 0);
  rot(nbone("spine"), moving ? 0.03 : Math.sin(t * 1.1) * 0.01, moving ? o * 0.025 : 0, 0);
  blink -= 1 / 60;
  if (blink < -4) blink = 0.1;
  vrm.expressionManager?.setValue?.("blink", blink > 0 ? Math.min(1, blink * 16) : 0);
}
function loco(moving, run) {
  if (!mixer || !actor) return;
  const want = moving ? (run && actor.userData.run ? actor.userData.run : actor.userData.walk || actor.userData.idle) : actor.userData.idle;
  for (const a of [actor.userData.idle, actor.userData.walk, actor.userData.run]) {
    if (!a || a === want) continue;
    if (a.isRunning()) a.fadeOut(0.25);
  }
  if (want && !want.isRunning()) want.reset().fadeIn(0.25).play();
}

const canvas = renderer.domElement;
canvas.style.touchAction = "none";
addEventListener("keydown", (e) => { keys[e.code] = true; });
addEventListener("keyup", (e) => { keys[e.code] = false; });
canvas.addEventListener("pointerdown", (e) => { if (e.button === 0) { dragging = true; canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener("pointerup", () => { dragging = false; });
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw -= e.movementX * 0.0038;
  pitch = THREE.MathUtils.clamp(pitch - e.movementY * 0.0026, 0.02, 0.95);
});
canvas.addEventListener("wheel", (e) => { e.preventDefault(); dist = THREE.MathUtils.clamp(dist + e.deltaY * 0.007, 2.0, 7.5); }, { passive: false });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.getElementById("cast").onclick = (e) => { const id = e.target.dataset.id; if (id) wear(id).catch((err) => toast(String(err.message || err))); };
document.getElementById("who").onclick = () => {
  const n = prompt("Name", document.getElementById("who").textContent);
  if (n) document.getElementById("who").textContent = n.slice(0, 16);
};

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  dance.material.emissiveIntensity = 0.25 + Math.sin(t * 2.2) * 0.12;
  key.intensity = 16 + Math.sin(t * 1.4) * 2;
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  const wantMove = !!(ix || iz);
  const run = !!(keys.ShiftLeft || keys.ShiftRight);
  if (wantMove) { const l = Math.hypot(ix, iz); ix /= l; iz /= l; }
  const max = run ? 5.2 : 2.5;
  const fX = -Math.sin(yaw), fZ = -Math.cos(yaw);
  const rX = Math.cos(yaw), rZ = -Math.sin(yaw);
  const tx = wantMove ? (fX * iz + rX * ix) * max : 0;
  const tz = wantMove ? (fZ * iz + rZ * ix) * max : 0;
  vx += (tx - vx) * Math.min(1, dt * (wantMove ? 7 : 5));
  vz += (tz - vz) * Math.min(1, dt * (wantMove ? 7 : 5));
  x = THREE.MathUtils.clamp(x + vx * dt, ROOM.minX, ROOM.maxX);
  z = THREE.MathUtils.clamp(z + vz * dt, ROOM.minZ, ROOM.maxZ);
  const spd = Math.hypot(vx, vz);
  const moving = spd > 0.22;
  if (moving) facing = Math.atan2(vx, vz);
  shown += shortest(shown, facing) * Math.min(1, dt * (moving ? 7 : 3.5));
  if (actor) {
    actor.position.set(x, 0, z);
    actor.rotation.y = shown + faceOff;
  }
  loco(moving, run);
  if (mixer) mixer.update(dt);
  gait(moving, run, spd * dt);
  if (vrm) vrm.update(dt);

  const lookY = 1.42;
  const shoulder = 0.38;
  const sx = Math.cos(yaw) * shoulder, sz = -Math.sin(yaw) * shoulder;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const wantX = x + sx + Math.sin(yaw) * cp * dist;
  const wantY = lookY + sp * dist * 0.9;
  const wantZ = z + sz + Math.cos(yaw) * cp * dist;
  cam.x += (wantX - cam.x) * Math.min(1, dt * 9);
  cam.y += (wantY - cam.y) * Math.min(1, dt * 9);
  cam.z += (wantZ - cam.z) * Math.min(1, dt * 9);
  camera.position.set(cam.x, cam.y, cam.z);
  camera.lookAt(x + sx * 0.35, lookY, z + sz * 0.35);
  renderer.render(scene, camera);
}
tick();
wear("aya").catch(() => wear("robot"));
</script>
</body>
</html>
