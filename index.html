<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hangout</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1630;color:#f3eee6;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none}
  #hud *{pointer-events:auto}
  #top{position:absolute;top:14px;left:16px;display:flex;gap:10px;align-items:center}
  .brand{letter-spacing:.25em;font-size:11px;text-transform:uppercase;opacity:.45}
  button,input{font:inherit;color:inherit}
  #who,#bar button{
    border:1px solid rgba(255,255,255,.14);background:rgba(10,8,16,.65);
    backdrop-filter:blur(12px);border-radius:999px;padding:6px 12px;cursor:pointer
  }
  #bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #hint{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);opacity:.55;font-size:12px;pointer-events:none;white-space:nowrap}
  #err{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:70%;color:#ffb4b4;display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud">
  <div id="top"><div class="brand">hangout</div><button id="who" type="button">you</button></div>
  <div id="hint">click here, then WASD — drag to look — scroll to zoom</div>
  <div id="bar">
    <button type="button" data-av="capsule">Body</button>
    <button type="button" data-av="robot">Robot</button>
    <button type="button" data-av="aya">Aya</button>
    <button type="button" data-world="none">Plaza</button>
    <button type="button" data-world="house">House</button>
    <button type="button" data-world="sponza">Sponza</button>
  </div>
  <div id="err"></div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const errBox = document.getElementById("err");
function fail(e) {
  console.error(e);
  errBox.style.display = "block";
  errBox.textContent = String(e && e.message ? e.message : e);
}
window.addEventListener("error", (e) => fail(e.error || e.message));
window.addEventListener("unhandledrejection", (e) => fail(e.reason));

const AV = {
  robot: "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb",
  aya: "https://cdn.jsdelivr.net/gh/madjin/vrm-samples@master/vroid/stable/AvatarSample_A.vrm",
};
const MAPS = {
  house: { url: "https://assets.babylonjs.com/meshes/house_scene.glb", h: 4.5, spawn: [1, 3] },
  sponza: { url: "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/Sponza/glTF/Sponza.gltf", h: 14, spawn: [0, 4] },
};

const keys = Object.create(null);
let yaw = 0.6, pitch = 0.28, dist = 6;
let x = 0, z = 4, facing = 0, dragging = false;
let actor = null, mixer = null, world = null, vrm = null, vrmPlug = null;
let bounds = { minX: -20, maxX: 20, minZ: -20, maxZ: 20 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2440);
scene.fog = new THREE.Fog(0x2a2440, 22, 55);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe8d2, 0x1a1020, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.35);
sun.position.set(8, 16, 10);
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(24, 48),
  new THREE.MeshStandardMaterial({ color: 0x3a3358, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
scene.add(new THREE.GridHelper(24, 24, 0x8b7fd4, 0x4a4270));

function capsule() {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x66e0ff, roughness: 0.4 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 1.05, 6, 12), mat);
  body.position.y = 0.85;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), mat);
  head.position.y = 1.62;
  g.add(body); g.add(head);
  return g;
}

function setActor(root, clips, vrmObj) {
  if (actor) scene.remove(actor);
  actor = root;
  scene.add(actor);
  mixer = clips && clips.length ? new THREE.AnimationMixer(root) : null;
  vrm = vrmObj || null;
  if (mixer) {
    const idle = clips.find((c) => /idle/i.test(c.name)) || clips[0];
    mixer.clipAction(idle).play();
    actor.userData.walk = clips.find((c) => /walk/i.test(c.name));
    actor.userData.run = clips.find((c) => /run/i.test(c.name));
    actor.userData.idle = idle;
    actor.userData.cur = idle;
  }
}

setActor(capsule(), []);

const loader = new GLTFLoader();
async function wear(id) {
  if (id === "capsule") { setActor(capsule(), []); return; }
  const url = AV[id]; if (!url) return;
  if (id === "aya" && !vrmPlug) {
    const mod = await import("https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.2/lib/three-vrm.module.min.js");
    loader.register((p) => new mod.VRMLoaderPlugin(p));
    vrmPlug = mod;
  }
  const gltf = await loader.loadAsync(url);
  const vr = gltf.userData && gltf.userData.vrm;
  if (vr && vrmPlug?.VRMUtils?.rotateVRM0) try { vrmPlug.VRMUtils.rotateVRM0(vr); } catch {}
  const root = vr ? vr.scene : gltf.scene;
  root.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  setActor(root, gltf.animations || [], vr);
}

async function loadMap(id) {
  if (world) { scene.remove(world); world = null; bounds = { minX: -20, maxX: 20, minZ: -20, maxZ: 20 }; }
  if (id === "none") { x = 0; z = 4; return; }
  const spec = MAPS[id]; if (!spec) return;
  const gltf = await loader.loadAsync(spec.url);
  world = gltf.scene;
  world.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
  const box = new THREE.Box3().setFromObject(world);
  const size = new THREE.Vector3(); box.getSize(size);
  world.scale.setScalar(size.y > 0.01 ? spec.h / size.y : 1);
  world.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(world);
  world.position.set(-(b.min.x + b.max.x) * 0.5, -b.min.y, -(b.min.z + b.max.z) * 0.5);
  world.updateMatrixWorld(true);
  const f = new THREE.Box3().setFromObject(world);
  bounds = { minX: f.min.x + 1, maxX: f.max.x - 1, minZ: f.min.z + 1, maxZ: f.max.z - 1 };
  scene.add(world);
  x = spec.spawn[0]; z = spec.spawn[1];
}

const canvas = renderer.domElement;
canvas.style.touchAction = "none";
addEventListener("keydown", (e) => { keys[e.code] = true; });
addEventListener("keyup", (e) => { keys[e.code] = false; });
canvas.addEventListener("pointerdown", (e) => {
  if (e.button === 0) { dragging = true; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener("pointerup", () => { dragging = false; });
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  yaw -= e.movementX * 0.005;
  pitch = Math.max(0.05, Math.min(1.2, pitch - e.movementY * 0.003));
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  dist = Math.max(2.2, Math.min(14, dist + e.deltaY * 0.01));
}, { passive: false });
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById("bar").addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset.av) wear(t.dataset.av).catch(fail);
  if (t.dataset.world) loadMap(t.dataset.world).catch(fail);
});
document.getElementById("who").onclick = () => {
  const n = prompt("Name", document.getElementById("who").textContent);
  if (n) document.getElementById("who").textContent = n.slice(0, 16);
};

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  let fx = 0, fz = 0;
  if (keys.KeyW || keys.ArrowUp) fz += 1;
  if (keys.KeyS || keys.ArrowDown) fz -= 1;
  if (keys.KeyA || keys.ArrowLeft) fx -= 1;
  if (keys.KeyD || keys.ArrowRight) fx += 1;
  const moving = fx || fz;
  if (moving) {
    const l = Math.hypot(fx, fz);
    fx /= l; fz /= l;
    const speed = (keys.ShiftLeft || keys.ShiftRight) ? 7 : 3.8;
    const fX = -Math.sin(yaw), fZ = -Math.cos(yaw);
    const rX = Math.cos(yaw), rZ = -Math.sin(yaw);
    const vx = fX * fz + rX * fx;
    const vz = fZ * fz + rZ * fx;
    x = Math.min(bounds.maxX, Math.max(bounds.minX, x + vx * speed * dt));
    z = Math.min(bounds.maxZ, Math.max(bounds.minZ, z + vz * speed * dt));
    facing = Math.atan2(vx, vz);
  }
  if (actor) {
    actor.position.set(x, 0, z);
    actor.rotation.y = facing;
  }
  if (mixer) mixer.update(dt);
  if (vrm) {
    const h = vrm.humanoid;
    if (h) {
      const s = moving ? 8 : 0;
      const a = moving ? 0.5 : 0;
      const bone = (n) => h.getNormalizedBoneNode?.(n) || h.getBoneNode?.(n);
      const L = bone("leftUpperLeg"), R = bone("rightUpperLeg");
      if (L) L.rotation.x = Math.sin(clock.elapsedTime * s) * a;
      if (R) R.rotation.x = Math.sin(clock.elapsedTime * s + Math.PI) * a;
    }
    vrm.update(dt);
  }
  const lookY = 1.25;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  camera.position.set(x + Math.sin(yaw) * cp * dist, lookY + sp * dist, z + Math.cos(yaw) * cp * dist);
  camera.lookAt(x, lookY, z);
  renderer.render(scene, camera);
}
tick();
wear("robot").catch(() => {});
</script>
</body>
</html>
