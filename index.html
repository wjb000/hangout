<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Hangout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="world" aria-label="world"></canvas>

  <!-- Minimal top-left identity -->
  <div id="ui-corner">
    <span id="ui-title">hangout</span>
    <span id="day-label">—</span>
  </div>

  <!-- Center topic when chatting -->
  <div id="topic-pill" class="hidden" aria-live="polite">
    <span id="topic-text"></span>
  </div>

  <!-- Speech log -->
  <div id="chatlog" aria-label="speech"></div>

  <!-- Bottom strip: people + essential tools only -->
  <nav id="bar">
    <div class="people">
      <button type="button" class="p bit" id="focus-bit" aria-label="Bit">
        <span class="orb"></span>
        <span class="txt">
          <b>Bit</b>
          <small id="bit-act">…</small>
        </span>
        <span class="track"><i id="bit-energy"></i></span>
      </button>
      <button type="button" class="p nox" id="focus-nox" aria-label="Nox">
        <span class="orb"></span>
        <span class="txt">
          <b>Nox</b>
          <small id="nox-act">…</small>
        </span>
        <span class="track"><i id="nox-energy"></i></span>
      </button>
    </div>

    <div class="tools">
      <button type="button" class="t" data-speed="0" id="spd-0" title="Pause">∥</button>
      <button type="button" class="t on" data-speed="1" id="spd-1" title="1x">▷</button>
      <button type="button" class="t" data-speed="2" id="spd-2" title="2x">▷▷</button>
      <span class="sep"></span>
      <button type="button" class="t" id="btn-view" title="Camera">◎</button>
      <button type="button" class="t" id="btn-call" title="Call">◉</button>
      <button type="button" class="t" id="btn-brain" title="AI mode">✦</button>
    </div>
  </nav>

  <!-- First visit -->
  <div id="onboard" class="hidden">
    <div class="sheet">
      <p class="kicker">a little place</p>
      <h1>Hangout</h1>
      <p class="blurb">Two small AIs live here. Watch them. That’s it.</p>
      <button type="button" id="enter-btn">Continue</button>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="status" class="sr-only" aria-live="polite"></div>
  <div id="rel-bar" class="sr-only"></div>
  <div id="debug" class="hidden"><pre id="dbg-body"></pre></div>
  <div id="progress"><i></i></div>

  <canvas id="vision" width="256" height="160" class="ghost"></canvas>
  <canvas id="minimap" width="1" height="1" class="ghost"></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
