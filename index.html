<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Little Land</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="world" aria-label="little land"></canvas>

  <!-- Top: minimal brand + clock -->
  <header id="topbar">
    <div class="brand">
      <span class="crest">⌂</span>
      <div>
        <div class="title">Little Land</div>
        <div class="sub" id="day-label">dusk settles</div>
      </div>
    </div>
    <div id="clock-ring" title="day cycle">
      <svg viewBox="0 0 36 36" class="ring">
        <circle cx="18" cy="18" r="15" class="ring-bg" />
        <circle cx="18" cy="18" r="15" class="ring-fg" id="day-ring" />
      </svg>
      <span id="clock-text">—</span>
    </div>
  </header>

  <!-- Floating topic when they talk -->
  <div id="topic-pill" class="hidden">
    <span class="pulse"></span>
    <span id="topic-text">…</span>
  </div>

  <!-- Bottom dock: dwellers + controls -->
  <footer id="dock">
    <div class="dwellers">
      <button type="button" class="dweller bit" id="focus-bit" data-id="bit">
        <span class="avatar bit-av"></span>
        <span class="meta">
          <strong>Bit</strong>
          <em id="bit-act">roaming</em>
        </span>
        <span class="bars">
          <i id="bit-energy" class="en"></i>
          <i id="bit-social" class="so"></i>
        </span>
      </button>
      <button type="button" class="dweller nox" id="focus-nox" data-id="nox">
        <span class="avatar nox-av"></span>
        <span class="meta">
          <strong>Nox</strong>
          <em id="nox-act">roaming</em>
        </span>
        <span class="bars">
          <i id="nox-energy" class="en"></i>
          <i id="nox-social" class="so"></i>
        </span>
      </button>
      <div class="rel" id="rel-bar">♥ ···</div>
    </div>

    <div class="controls">
      <div class="speed" title="sim speed">
        <button type="button" data-speed="0" id="spd-0">❚❚</button>
        <button type="button" data-speed="0.5" id="spd-05">½</button>
        <button type="button" data-speed="1" id="spd-1" class="on">1×</button>
        <button type="button" data-speed="2" id="spd-2">2×</button>
      </div>
      <button type="button" class="tool" id="btn-call" title="Call (Q)">◎</button>
      <button type="button" class="tool" id="btn-beacon" title="Beacon (E)">✦</button>
      <button type="button" class="tool" id="btn-view" title="View (C)">◉</button>
      <button type="button" class="tool" id="btn-brain" title="Brain (B)">◈</button>
    </div>
  </footer>

  <!-- Chat as soft log over the land -->
  <div id="chatlog" aria-label="voices"></div>
  <div id="status" class="hidden">…</div>

  <div id="onboard" class="hidden">
    <div class="onboard-card">
      <div class="crest-lg">⌂</div>
      <h2>Little Land</h2>
      <p>A small tavern-world. Tiny people live their day while you watch from above.</p>
      <ul>
        <li>Morning kitchen · afternoon roam · evening hearth · night rest</li>
        <li>Click a dweller to glance at them</li>
        <li>Speed the day with ½ / 1× / 2×</li>
      </ul>
      <button type="button" id="enter-btn">Watch the land</button>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="debug" class="hidden"><pre id="dbg-body"></pre></div>
  <div id="progress"><i></i></div>

  <!-- Hidden canvases for VLA / map (not primary UI) -->
  <canvas id="vision" width="256" height="160" class="offscreen"></canvas>
  <canvas id="minimap" width="1" height="1" class="offscreen"></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
