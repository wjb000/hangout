<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <header id="top">
    <div class="brand">hangout</div>
    <button type="button" id="who">you</button>
    <span id="link" class="dim">world</span>
  </header>

  <ul id="pills"></ul>
  <div id="toast"></div>

  <div id="picker"></div>

  <div id="chat" class="idle">
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" maxlength="160" placeholder="T to chat" autocomplete="off" />
    </form>
  </div>

  <p id="hint">WASD move · mouse look · click a character to wear it</p>

  <script type="module" src="world.mjs"></script>
</body>
</html>
