<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d12;
      color: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: min(420px, 100%);
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      background: linear-gradient(160deg, #151922 0%, #0f1218 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #9ecbff;
      background: rgba(100, 160, 255, 0.12);
      border: 1px solid rgba(100, 160, 255, 0.2);
    }

    h1 {
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    p {
      color: #9aa3b2;
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Fresh start</div>
    <h1>Hangout</h1>
    <p>Blank page. Ready to build.</p>
  </main>
</body>
</html>
