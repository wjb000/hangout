<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      color: #555;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      overflow: hidden;
      user-select: none;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    #sprite {
      position: absolute;
      width: 32px;
      height: 40px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
      z-index: 2;
      will-change: left, top;
    }

    #sprite.flip { transform: translate(-50%, -50%) scaleX(-1); }

    #sprite .body {
      position: absolute;
      inset: 8px 6px 4px;
      background: #6ec6ff;
      border-radius: 4px 4px 2px 2px;
      box-shadow: 0 0 14px rgba(110, 198, 255, 0.4);
      transition: background 0.3s, box-shadow 0.3s;
    }

    #sprite .head {
      position: absolute;
      top: 0;
      left: 8px;
      width: 16px;
      height: 14px;
      background: #b8e4ff;
      border-radius: 3px;
    }

    #sprite .eye {
      position: absolute;
      top: 5px;
      width: 3px;
      height: 3px;
      background: #111;
      border-radius: 1px;
    }

    #sprite .eye.l { left: 10px; }
    #sprite .eye.r { left: 19px; }

    #sprite .leg {
      position: absolute;
      bottom: 0;
      width: 5px;
      height: 8px;
      background: #3a8fc4;
      border-radius: 1px;
    }

    #sprite .leg.l { left: 9px; }
    #sprite .leg.r { right: 9px; }

    #sprite.walk .leg.l { animation: step 0.16s infinite alternate; }
    #sprite.walk .leg.r { animation: step 0.16s infinite alternate-reverse; }

    @keyframes step {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    #sprite.think .body { background: #c9a0ff; box-shadow: 0 0 14px rgba(201, 160, 255, 0.45); }
    #sprite.happy .body { background: #7dffb3; box-shadow: 0 0 14px rgba(125, 255, 179, 0.45); }
    #sprite.curious .body { background: #ffe08a; box-shadow: 0 0 14px rgba(255, 224, 138, 0.4); }
    #sprite.wave .head { animation: bob 0.4s ease 2; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      max-width: min(420px, calc(100vw - 24px));
      color: #333;
      z-index: 10;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s, opacity 0.5s;
      pointer-events: none;
    }

    #status.warn { color: #665522; }
    #status.err { color: #663333; pointer-events: auto; cursor: pointer; }
    #status.ok { color: #1a1a1a; }

    #progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: transparent;
      z-index: 11;
      display: none;
    }

    #progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: #2a5a7a;
      transition: width 0.15s linear;
    }

    #goal {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #222;
      font-size: 10px;
      letter-spacing: 0.04em;
      z-index: 5;
      max-width: 80vw;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="goal"></div>
  <div id="stage">
    <div id="sprite" aria-label="autonomous sprite">
      <div class="head"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="body"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
  </div>
  <div id="status">waking…</div>
  <div id="progress"><i></i></div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const MODELS = [
      "SmolLM2-360M-Instruct-q4f16_1-MLC",
      "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
      "Llama-3.2-1B-Instruct-q4f16_1-MLC",
    ];

    const BASE_SPEED = 90;
    const DIRS = {
      left:      { vx: -1, vy:  0 },
      right:     { vx:  1, vy:  0 },
      up:        { vx:  0, vy: -1 },
      down:      { vx:  0, vy:  1 },
      upleft:    { vx: -0.7, vy: -0.7 },
      upright:   { vx:  0.7, vy: -0.7 },
      downleft:  { vx: -0.7, vy:  0.7 },
      downright: { vx:  0.7, vy:  0.7 },
    };

    const stage = document.getElementById("stage");
    const sprite = document.getElementById("sprite");
    const statusEl = document.getElementById("status");
    const goalEl = document.getElementById("goal");
    const progressEl = document.getElementById("progress");
    const progressBar = progressEl.querySelector("i");

    let engine = null;
    let thinking = false;
    let running = true;
    let facing = 1;
    let lastFrame = 0;
    let tickCount = 0;
    let speedMul = 1;

    // autonomous mind state — persists across decisions
    const mind = {
      goal: "wake up and explore the void",
      memory: [],       // recent events (short)
      ticks: 0,
      energy: 1,
      persona: "lonely curious glitch living alone in black space",
    };

    const state = {
      x: 0,
      y: 0,
      vx: 1,
      vy: 0,
      mood: "curious",
      lastSaid: "",
      move: "right",
    };

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function setGoalLabel(g) {
      mind.goal = g || mind.goal;
      goalEl.textContent = mind.goal ? `◈ ${mind.goal}` : "";
    }

    function stageSize() {
      return { w: stage.clientWidth, h: stage.clientHeight };
    }

    function placeSprite(x, y) {
      const { w, h } = stageSize();
      const pad = 28;
      x = Math.max(pad, Math.min(w - pad, x));
      y = Math.max(pad, Math.min(h - pad, y));
      state.x = x;
      state.y = y;
      sprite.style.left = `${x}px`;
      sprite.style.top = `${y}px`;
    }

    function setFacing(dir) {
      facing = dir;
      sprite.classList.toggle("flip", facing < 0);
    }

    function setMood(mood) {
      sprite.classList.remove("think", "happy", "wave", "curious");
      state.mood = mood || "idle";
      if (["think", "happy", "wave", "curious"].includes(mood)) {
        sprite.classList.add(mood);
      }
      // mood affects pace
      if (mood === "happy" || mood === "wave") speedMul = 1.25;
      else if (mood === "think") speedMul = 0.7;
      else if (mood === "curious") speedMul = 1.05;
      else speedMul = 1;
    }

    function say(text) {
      // keep last words in mind state only — no on-screen bubble
      if (!text || !String(text).trim()) return;
      state.lastSaid = String(text).trim();
    }

    function remember(line) {
      mind.memory.push(line);
      if (mind.memory.length > 8) mind.memory.shift();
    }

    function setDirection(name) {
      let dir = String(name || "right").toLowerCase().replace(/[_\s-]/g, "");
      if (dir === "none" || dir === "stay") dir = state.move || "right";
      if (dir === "random" || !DIRS[dir]) {
        const keys = Object.keys(DIRS);
        dir = keys[Math.floor(Math.random() * keys.length)];
      }
      const d = DIRS[dir];
      state.move = dir;
      state.vx = d.vx;
      state.vy = d.vy;
      if (Math.abs(d.vx) > 0.01) setFacing(d.vx > 0 ? 1 : -1);
    }

    function applyAction(action) {
      if (!action || typeof action !== "object") return;

      if (action.goal) setGoalLabel(String(action.goal).slice(0, 80));
      if (action.move) setDirection(action.move);
      if (action.mood) setMood(String(action.mood).toLowerCase());
      if (action.say) say(action.say);
      if (typeof action.speed === "number") {
        speedMul = Math.max(0.4, Math.min(1.8, action.speed));
      }

      remember(
        `t${mind.ticks}: ${state.move}` +
        (action.say ? ` “${String(action.say).slice(0, 40)}”` : "") +
        (action.goal ? ` goal→${String(action.goal).slice(0, 30)}` : "")
      );
    }

    function parseAction(raw) {
      if (!raw) return null;
      let t = raw.trim();
      const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fence) t = fence[1].trim();
      const brace = t.match(/\{[\s\S]*\}/);
      if (brace) t = brace[0];
      try {
        return JSON.parse(t);
      } catch {
        const lower = raw.toLowerCase();
        const move =
          lower.includes("upleft") || lower.includes("up-left") ? "upleft" :
          lower.includes("upright") ? "upright" :
          lower.includes("downleft") ? "downleft" :
          lower.includes("downright") ? "downright" :
          lower.includes("left") ? "left" :
          lower.includes("right") ? "right" :
          lower.includes("up") ? "up" :
          lower.includes("down") ? "down" : "random";
        return { move, say: raw.slice(0, 60), mood: "curious" };
      }
    }

    function region() {
      const { w, h } = stageSize();
      const cx = state.x / w;
      const cy = state.y / h;
      const hs = cx < 0.33 ? "west" : cx > 0.66 ? "east" : "center";
      const vs = cy < 0.33 ? "north" : cy > 0.66 ? "south" : "mid";
      return `${vs}-${hs}`;
    }

    function systemPrompt() {
      const { w, h } = stageSize();
      return `You are an AUTONOMOUS sprite. No human is controlling you. You live alone on a black ${w}x${h} stage and decide everything yourself.

Identity: ${mind.persona}
Current goal: ${mind.goal}
Position: (${Math.round(state.x)}, ${Math.round(state.y)}) region=${region()}
Heading: ${state.move}  mood=${state.mood}  energy=${mind.energy.toFixed(2)}  life_ticks=${mind.ticks}
Recent memory:
${mind.memory.length ? mind.memory.map((m) => "- " + m).join("\n") : "- (blank slate)"}
Last words: ${JSON.stringify(state.lastSaid || "")}

Each tick, invent your next moment. You may keep or rewrite your goal.
Reply with ONLY one JSON object:
{"goal":"what you're pursuing right now","move":"left|right|up|down|upleft|upright|downleft|downright|random","say":"optional short thought max 12 words or empty","mood":"idle|think|happy|wave|curious","speed":0.5-1.6}

Autonomy rules:
- NEVER wait for a human. Always choose a move.
- Have inner life: boredom, wonder, rituals, tiny quests (corners, laps, zigzags).
- Change goals every few ticks when done or bored.
- Speak only when it feels natural (~30% of ticks).
- Stay in character as a glitch creature in the void.`;
    }

    function tick(now) {
      if (!lastFrame) lastFrame = now;
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      tickCount++;

      if (running) {
        sprite.classList.add("walk");
        const { w, h } = stageSize();
        const pad = 28;
        const sp = BASE_SPEED * speedMul;
        let nx = state.x + state.vx * sp * dt;
        let ny = state.y + state.vy * sp * dt;

        if (nx <= pad) { nx = pad; setDirection(state.vy < 0 ? "upright" : state.vy > 0 ? "downright" : "right"); }
        else if (nx >= w - pad) { nx = w - pad; setDirection(state.vy < 0 ? "upleft" : state.vy > 0 ? "downleft" : "left"); }
        if (ny <= pad) { ny = pad; setDirection(state.vx < 0 ? "downleft" : state.vx > 0 ? "downright" : "down"); }
        else if (ny >= h - pad) { ny = h - pad; setDirection(state.vx < 0 ? "upleft" : state.vx > 0 ? "upright" : "up"); }

        placeSprite(nx, ny);
      } else {
        sprite.classList.remove("walk");
      }

      requestAnimationFrame(tick);
    }

    async function thinkOnce() {
      if (!engine || thinking || !running) return;
      thinking = true;
      mind.ticks += 1;
      mind.energy = Math.max(0.2, Math.min(1, mind.energy + (Math.random() * 0.1 - 0.04)));

      try {
        const messages = [
          { role: "system", content: systemPrompt() },
          {
            role: "user",
            content:
              mind.ticks === 1
                ? "You just woke in the void. Set a first goal and start moving. Be autonomous."
                : `Autonomous tick #${mind.ticks}. Continue living. No one is watching for commands — only exist.`,
          },
        ];

        const reply = await engine.chat.completions.create({
          messages,
          temperature: 1.0,
          max_tokens: 100,
        });

        const content = reply?.choices?.[0]?.message?.content || "";
        const action = parseAction(content);
        if (running) applyAction(action);

        setStatus(
          `autonomous · t${mind.ticks} · ${state.move}` +
            (action?.say ? ` · “${String(action.say).slice(0, 28)}”` : ""),
          "ok"
        );
      } catch (err) {
        console.error(err);
        setStatus(`brain glitch — still running legs`, "warn");
        setDirection("random");
        remember(`t${mind.ticks}: glitch, improvised ${state.move}`);
      } finally {
        thinking = false;
      }
    }

    async function autonomousLoop() {
      while (running && engine) {
        await thinkOnce();
        // brief rest between thoughts; body keeps running via rAF
        await new Promise((r) => setTimeout(r, 350));
      }
    }

    async function boot() {
      if (engine) return;

      if (!navigator.gpu) {
        setStatus("needs WebGPU (Chrome/Edge) — click to retry", "err");
        return;
      }

      progressEl.style.display = "block";
      progressBar.style.width = "0%";
      setStatus("downloading mind…", "warn");
      setGoalLabel("booting consciousness");

      const initProgressCallback = (report) => {
        const p = Math.round((report.progress || 0) * 100);
        progressBar.style.width = `${p}%`;
        setStatus(`${report.text || "loading"} ${p}%`, "warn");
      };

      let lastErr = null;
      for (const model of MODELS) {
        try {
          engine = await CreateMLCEngine(model, { initProgressCallback });
          progressBar.style.width = "100%";
          setTimeout(() => { progressEl.style.display = "none"; }, 400);
          setMood("curious");
          say("i am");
          setGoalLabel("explore every corner of the void");
          setStatus("autonomous", "ok");
          // fade status after a bit — pure creature on black
          setTimeout(() => {
            if (statusEl.className === "ok") statusEl.style.opacity = "0.35";
          }, 4000);
          autonomousLoop();
          return;
        } catch (err) {
          console.warn(model, err);
          lastErr = err;
          engine = null;
        }
      }

      progressEl.style.display = "none";
      setStatus(`failed — click to retry (${lastErr?.message || "error"})`, "err");
    }

    // body always runs
    function recenter() {
      const { w, h } = stageSize();
      placeSprite(w / 2, h / 2);
    }
    recenter();
    setDirection("right");
    setMood("curious");
    requestAnimationFrame(tick);

    // pre-brain body autonomy
    setInterval(() => {
      if (!engine && running) setDirection("random");
    }, 2200);

    window.addEventListener("resize", () => placeSprite(state.x, state.y));
    statusEl.addEventListener("click", () => {
      if (statusEl.classList.contains("err")) boot();
    });

    boot();
  </script>
</body>
</html>
