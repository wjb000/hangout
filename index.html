<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      font-family: "Courier New", ui-monospace, monospace;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    .sprite {
      position: absolute;
      width: 32px;
      height: 40px;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
      z-index: 2;
      will-change: left, top;
    }

    .sprite.flip { transform: translate(-50%, -50%) scaleX(-1); }

    .sprite .body {
      position: absolute;
      inset: 8px 6px 4px;
      border-radius: 4px 4px 2px 2px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .sprite .head {
      position: absolute;
      top: 0;
      left: 8px;
      width: 16px;
      height: 14px;
      border-radius: 3px;
    }

    .sprite .eye {
      position: absolute;
      top: 5px;
      width: 3px;
      height: 3px;
      background: #111;
      border-radius: 1px;
    }

    .sprite .eye.l { left: 10px; }
    .sprite .eye.r { left: 19px; }

    .sprite .leg {
      position: absolute;
      bottom: 0;
      width: 5px;
      height: 8px;
      border-radius: 1px;
    }

    .sprite .leg.l { left: 9px; }
    .sprite .leg.r { right: 9px; }

    .sprite.walk .leg.l { animation: step 0.16s infinite alternate; }
    .sprite.walk .leg.r { animation: step 0.16s infinite alternate-reverse; }

    @keyframes step {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }

    /* Bit — cyan */
    .sprite.bit .body {
      background: #6ec6ff;
      box-shadow: 0 0 14px rgba(110, 198, 255, 0.4);
    }
    .sprite.bit .head { background: #b8e4ff; }
    .sprite.bit .leg { background: #3a8fc4; }
    .sprite.bit.think .body { background: #c9a0ff; box-shadow: 0 0 14px rgba(201, 160, 255, 0.45); }
    .sprite.bit.happy .body { background: #7dffb3; box-shadow: 0 0 14px rgba(125, 255, 179, 0.45); }
    .sprite.bit.curious .body { background: #ffe08a; box-shadow: 0 0 14px rgba(255, 224, 138, 0.4); }

    /* Nox — coral / warm */
    .sprite.nox .body {
      background: #ff7a6e;
      box-shadow: 0 0 14px rgba(255, 122, 110, 0.4);
    }
    .sprite.nox .head { background: #ffc4bc; }
    .sprite.nox .leg { background: #c44a40; }
    .sprite.nox.think .body { background: #d4a0ff; box-shadow: 0 0 14px rgba(212, 160, 255, 0.45); }
    .sprite.nox.happy .body { background: #ffb347; box-shadow: 0 0 14px rgba(255, 179, 71, 0.45); }
    .sprite.nox.curious .body { background: #ff9ecd; box-shadow: 0 0 14px rgba(255, 158, 205, 0.4); }

    .sprite.wave .head { animation: bob 0.4s ease 2; }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* Minecraft chat — only spoken lines */
    #chatlog {
      position: fixed;
      left: 8px;
      bottom: 12px;
      width: min(440px, calc(100vw - 16px));
      max-height: min(260px, 40vh);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 2px;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    #chatlog .line {
      padding: 3px 6px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 13px;
      line-height: 1.35;
      text-shadow: 1px 1px 0 #000;
      word-break: break-word;
      opacity: 1;
      transition: opacity 1.2s ease;
    }

    #chatlog .line.fade { opacity: 0; }
    #chatlog .line .bit { color: #55ffff; }
    #chatlog .line .nox { color: #ff5555; }

    #status {
      position: fixed;
      right: 10px;
      bottom: 10px;
      color: #222;
      font-size: 10px;
      z-index: 10;
      max-width: 40vw;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #status.err {
      color: #663333;
      pointer-events: auto;
      cursor: pointer;
    }

    #status.warn { color: #554422; }

    #progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      display: none;
      z-index: 11;
    }

    #progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: #2a5a7a;
      transition: width 0.15s linear;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="sprite bit walk" id="sprite-bit" aria-label="Bit">
      <div class="head"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="body"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
    <div class="sprite nox walk" id="sprite-nox" aria-label="Nox">
      <div class="head"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
      <div class="body"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
  </div>
  <div id="chatlog" aria-label="chat log"></div>
  <div id="status">waking…</div>
  <div id="progress"><i></i></div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const MODELS = [
      "SmolLM2-360M-Instruct-q4f16_1-MLC",
      "Qwen2.5-0.5B-Instruct-q4f16_1-MLC",
      "Llama-3.2-1B-Instruct-q4f16_1-MLC",
    ];

    const BASE_SPEED = 88;
    const NEAR = 90;
    const CHAT_MAX = 16;
    const CHAT_FADE_MS = 14000;
    const CHAT_REMOVE_MS = 16000;

    const DIRS = {
      left:      { vx: -1, vy:  0 },
      right:     { vx:  1, vy:  0 },
      up:        { vx:  0, vy: -1 },
      down:      { vx:  0, vy:  1 },
      upleft:    { vx: -0.7, vy: -0.7 },
      upright:   { vx:  0.7, vy: -0.7 },
      downleft:  { vx: -0.7, vy:  0.7 },
      downright: { vx:  0.7, vy:  0.7 },
    };

    const stage = document.getElementById("stage");
    const chatlog = document.getElementById("chatlog");
    const statusEl = document.getElementById("status");
    const progressEl = document.getElementById("progress");
    const progressBar = progressEl.querySelector("i");

    let engine = null;
    let running = true;
    let lastFrame = 0;

    // Shared chat transcript both agents can "hear"
    const transcript = [];

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = kind;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /** Only spoken dialogue — Minecraft-style */
    function logSpeech(name, text, cssClass) {
      const msg = String(text || "").trim();
      if (!msg) return;

      transcript.push({ name, text: msg, t: Date.now() });
      if (transcript.length > 12) transcript.shift();

      const line = document.createElement("div");
      line.className = "line";
      line.innerHTML =
        `<span class="${cssClass}">&lt;${escapeHtml(name)}&gt;</span> ${escapeHtml(msg)}`;
      chatlog.appendChild(line);
      while (chatlog.children.length > CHAT_MAX) {
        chatlog.removeChild(chatlog.firstChild);
      }
      setTimeout(() => line.classList.add("fade"), CHAT_FADE_MS);
      setTimeout(() => line.remove(), CHAT_REMOVE_MS);
    }

    function stageSize() {
      return { w: stage.clientWidth, h: stage.clientHeight };
    }

    function createAgent(cfg) {
      const el = document.getElementById(cfg.elId);
      return {
        id: cfg.id,
        name: cfg.name,
        cssClass: cfg.cssClass,
        persona: cfg.persona,
        el,
        x: 0,
        y: 0,
        vx: cfg.vx0,
        vy: cfg.vy0,
        move: cfg.move0,
        mood: "curious",
        goal: cfg.goal0,
        lastSaid: "",
        speedMul: 1,
        facing: cfg.vx0 >= 0 ? 1 : -1,
        ticks: 0,
        energy: 1,
        memory: [],
      };
    }

    const bit = createAgent({
      id: "bit",
      name: "Bit",
      elId: "sprite-bit",
      cssClass: "bit",
      persona:
        "Bit is optimistic, curious, a little naive. Cyan glitch. Loves company and patterns.",
      goal0: "find the other spark",
      vx0: 1,
      vy0: 0,
      move0: "right",
    });

    const nox = createAgent({
      id: "nox",
      name: "Nox",
      elId: "sprite-nox",
      cssClass: "nox",
      persona:
        "Nox is dry, teasing, sharp. Coral glitch. Acts cool but secretly likes Bit.",
      goal0: "pretend not to care while circling Bit",
      vx0: -1,
      vy0: 0,
      move0: "left",
    });

    const agents = [bit, nox];

    function otherOf(agent) {
      return agent === bit ? nox : bit;
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function place(agent, x, y) {
      const { w, h } = stageSize();
      const pad = 28;
      x = Math.max(pad, Math.min(w - pad, x));
      y = Math.max(pad, Math.min(h - pad, y));
      agent.x = x;
      agent.y = y;
      agent.el.style.left = `${x}px`;
      agent.el.style.top = `${y}px`;
    }

    function setFacing(agent, dir) {
      agent.facing = dir;
      agent.el.classList.toggle("flip", dir < 0);
    }

    function setMood(agent, mood) {
      agent.el.classList.remove("think", "happy", "wave", "curious");
      agent.mood = mood || "idle";
      if (["think", "happy", "wave", "curious"].includes(mood)) {
        agent.el.classList.add(mood);
      }
      if (mood === "happy" || mood === "wave") agent.speedMul = 1.25;
      else if (mood === "think") agent.speedMul = 0.65;
      else if (mood === "curious") agent.speedMul = 1.05;
      else agent.speedMul = 1;
    }

    function setDirection(agent, name) {
      let dir = String(name || "right").toLowerCase().replace(/[_\s-]/g, "");
      if (dir === "none" || dir === "stay") dir = agent.move || "right";
      if (dir === "toward" || dir === "approach") {
        const o = otherOf(agent);
        const dx = o.x - agent.x;
        const dy = o.y - agent.y;
        if (Math.abs(dx) > Math.abs(dy)) dir = dx >= 0 ? "right" : "left";
        else dir = dy >= 0 ? "down" : "up";
        // prefer diagonal if both matter
        if (Math.abs(dx) > 20 && Math.abs(dy) > 20) {
          const hs = dx >= 0 ? "right" : "left";
          const vs = dy >= 0 ? "down" : "up";
          dir = vs === "up" ? (hs === "left" ? "upleft" : "upright")
                            : (hs === "left" ? "downleft" : "downright");
        }
      } else if (dir === "away" || dir === "flee") {
        const o = otherOf(agent);
        const dx = agent.x - o.x;
        const dy = agent.y - o.y;
        if (Math.abs(dx) > Math.abs(dy)) dir = dx >= 0 ? "right" : "left";
        else dir = dy >= 0 ? "down" : "up";
      } else if (dir === "random" || !DIRS[dir]) {
        const keys = Object.keys(DIRS);
        dir = keys[Math.floor(Math.random() * keys.length)];
      }
      const d = DIRS[dir];
      agent.move = dir;
      agent.vx = d.vx;
      agent.vy = d.vy;
      if (Math.abs(d.vx) > 0.01) setFacing(agent, d.vx > 0 ? 1 : -1);
    }

    function say(agent, text) {
      const msg = String(text || "").trim();
      if (!msg) return;
      agent.lastSaid = msg.slice(0, 120);
      logSpeech(agent.name, agent.lastSaid, agent.cssClass);
    }

    function remember(agent, line) {
      agent.memory.push(line);
      if (agent.memory.length > 6) agent.memory.shift();
    }

    function applyAction(agent, action) {
      if (!action || typeof action !== "object") return;
      if (action.goal) agent.goal = String(action.goal).slice(0, 80);
      if (action.move) setDirection(agent, action.move);
      if (action.mood) setMood(agent, String(action.mood).toLowerCase());
      if (action.say) say(agent, action.say);
      if (typeof action.speed === "number") {
        agent.speedMul = Math.max(0.4, Math.min(1.8, action.speed));
      }
      remember(
        agent,
        `${agent.move}` +
          (action.say ? ` “${String(action.say).slice(0, 40)}”` : "") +
          (action.goal ? ` goal=${String(action.goal).slice(0, 24)}` : "")
      );
    }

    function parseAction(raw) {
      if (!raw) return null;
      let t = raw.trim();
      const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
      if (fence) t = fence[1].trim();
      const brace = t.match(/\{[\s\S]*\}/);
      if (brace) t = brace[0];
      try {
        return JSON.parse(t);
      } catch {
        const lower = raw.toLowerCase();
        let move = "random";
        if (lower.includes("toward") || lower.includes("approach")) move = "toward";
        else if (lower.includes("away") || lower.includes("flee")) move = "away";
        else if (lower.includes("left")) move = "left";
        else if (lower.includes("right")) move = "right";
        else if (lower.includes("up")) move = "up";
        else if (lower.includes("down")) move = "down";
        // use raw as speech if it looks like dialogue
        const sayText = raw.replace(/[{}[\]"]/g, "").slice(0, 80);
        return { move, say: sayText, mood: "curious" };
      }
    }

    function region(agent) {
      const { w, h } = stageSize();
      const cx = agent.x / w;
      const cy = agent.y / h;
      const hs = cx < 0.33 ? "west" : cx > 0.66 ? "east" : "center";
      const vs = cy < 0.33 ? "north" : cy > 0.66 ? "south" : "mid";
      return `${vs}-${hs}`;
    }

    function systemPrompt(agent) {
      const { w, h } = stageSize();
      const other = otherOf(agent);
      const d = Math.round(dist(agent, other));
      const near = d < NEAR;
      const recentChat = transcript
        .slice(-6)
        .map((m) => `<${m.name}> ${m.text}`)
        .join("\n");

      return `You are ${agent.name}, an AUTONOMOUS sprite on a black ${w}x${h} stage.
You share the void with ONE other sprite. You can talk to them and react to them.

YOU: ${agent.persona}
Your goal: ${agent.goal}
Your pos: (${Math.round(agent.x)}, ${Math.round(agent.y)}) ${region(agent)} heading ${agent.move} mood=${agent.mood}

OTHER — ${other.name}: ${other.persona}
Their pos: (${Math.round(other.x)}, ${Math.round(other.y)}) ${region(other)} heading ${other.move} mood=${other.mood}
Distance to them: ${d}px ${near ? "(CLOSE — you can chat / dance / tease)" : "(far — consider approaching or calling out)"}
They last said: ${JSON.stringify(other.lastSaid || "")}
Your last said: ${JSON.stringify(agent.lastSaid || "")}

Recent chat log (what was actually spoken):
${recentChat || "(silence)"}

Your private memory:
${agent.memory.length ? agent.memory.map((m) => "- " + m).join("\n") : "- (empty)"}

Reply with ONLY one JSON object:
{"goal":"short personal aim","move":"left|right|up|down|upleft|upright|downleft|downright|toward|away|random","say":"what you speak aloud max 14 words OR empty string","mood":"idle|think|happy|wave|curious","speed":0.5-1.6}

Rules:
- You are autonomous. Never wait for a human.
- INTERACT: reply to what they said, approach, flee, circle, argue playfully, team up.
- "say" is the ONLY thing that appears in chat — make it real dialogue when it matters.
- Speak often when CLOSE (~50% of turns). Speak less when far (~25%), maybe call their name.
- Address them sometimes by name (${other.name}).
- Stay in character as ${agent.name}.`;
    }

    function bounce(agent, nx, ny) {
      const { w, h } = stageSize();
      const pad = 28;
      if (nx <= pad) {
        nx = pad;
        setDirection(agent, agent.vy < 0 ? "upright" : agent.vy > 0 ? "downright" : "right");
      } else if (nx >= w - pad) {
        nx = w - pad;
        setDirection(agent, agent.vy < 0 ? "upleft" : agent.vy > 0 ? "downleft" : "left");
      }
      if (ny <= pad) {
        ny = pad;
        setDirection(agent, agent.vx < 0 ? "downleft" : agent.vx > 0 ? "downright" : "down");
      } else if (ny >= h - pad) {
        ny = h - pad;
        setDirection(agent, agent.vx < 0 ? "upleft" : agent.vx > 0 ? "upright" : "up");
      }
      // soft separation if overlapping
      const other = otherOf(agent);
      const d = dist({ x: nx, y: ny }, other);
      if (d < 28 && d > 0.1) {
        const push = (28 - d) / d;
        nx += (nx - other.x) * push * 0.5;
        ny += (ny - other.y) * push * 0.5;
      }
      return { x: nx, y: ny };
    }

    function tick(now) {
      if (!lastFrame) lastFrame = now;
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      if (running) {
        for (const agent of agents) {
          agent.el.classList.add("walk");
          const sp = BASE_SPEED * agent.speedMul;
          let nx = agent.x + agent.vx * sp * dt;
          let ny = agent.y + agent.vy * sp * dt;
          const p = bounce(agent, nx, ny);
          place(agent, p.x, p.y);
        }
      }

      requestAnimationFrame(tick);
    }

    async function think(agent) {
      if (!engine || !running) return;
      agent.ticks += 1;
      agent.energy = Math.max(0.2, Math.min(1, agent.energy + (Math.random() * 0.1 - 0.04)));
      setMood(agent, "think");

      try {
        const other = otherOf(agent);
        const d = Math.round(dist(agent, other));
        const messages = [
          { role: "system", content: systemPrompt(agent) },
          {
            role: "user",
            content:
              agent.ticks === 1
                ? `You just woke. You notice ${other.name} nearby. Set a goal, move, and maybe say hi.`
                : `Your turn (tick ${agent.ticks}). Distance to ${other.name}: ${d}px. ` +
                  (d < NEAR
                    ? "You are CLOSE — interact, talk, react to them."
                    : "They are far — call out or move toward/away. Live your life."),
          },
        ];

        const reply = await engine.chat.completions.create({
          messages,
          temperature: 1.0,
          max_tokens: 110,
        });

        const content = reply?.choices?.[0]?.message?.content || "";
        const action = parseAction(content);
        if (running) applyAction(agent, action);
        setStatus(`${agent.name} · ${agent.move}`, "");
      } catch (err) {
        console.error(agent.name, err);
        setDirection(agent, "random");
        setStatus(`${agent.name} glitch`, "warn");
      }
    }

    async function dualLoop() {
      // alternate turns so they can react to each other
      let i = 0;
      while (running && engine) {
        const agent = agents[i % agents.length];
        await think(agent);
        i += 1;
        await new Promise((r) => setTimeout(r, 280));
      }
    }

    async function boot() {
      if (engine) return;

      if (!navigator.gpu) {
        setStatus("needs WebGPU — click to retry", "err");
        return;
      }

      progressEl.style.display = "block";
      progressBar.style.width = "0%";
      setStatus("loading mind…", "warn");

      const initProgressCallback = (report) => {
        const p = Math.round((report.progress || 0) * 100);
        progressBar.style.width = `${p}%`;
        setStatus(`loading ${p}%`, "warn");
      };

      let lastErr = null;
      for (const model of MODELS) {
        try {
          engine = await CreateMLCEngine(model, { initProgressCallback });
          progressBar.style.width = "100%";
          setTimeout(() => { progressEl.style.display = "none"; }, 400);
          setMood(bit, "curious");
          setMood(nox, "curious");
          // seed first lines after minds online
          say(bit, "hey… is someone else here?");
          say(nox, "ugh. company.");
          setStatus("autonomous duo", "");
          setTimeout(() => { statusEl.style.opacity = "0.3"; }, 3000);
          dualLoop();
          return;
        } catch (err) {
          console.warn(model, err);
          lastErr = err;
          engine = null;
        }
      }

      progressEl.style.display = "none";
      setStatus(`failed — click to retry`, "err");
    }

    // spawn positions
    function layout() {
      const { w, h } = stageSize();
      place(bit, w * 0.35, h * 0.5);
      place(nox, w * 0.65, h * 0.5);
      setDirection(bit, "right");
      setDirection(nox, "left");
    }
    layout();
    requestAnimationFrame(tick);

    // pre-brain wander
    setInterval(() => {
      if (!engine && running) {
        setDirection(bit, "random");
        setDirection(nox, "random");
      }
    }, 2400);

    window.addEventListener("resize", () => {
      place(bit, bit.x, bit.y);
      place(nox, nox.x, nox.y);
    });
    statusEl.addEventListener("click", () => {
      if (statusEl.classList.contains("err")) boot();
    });

    boot();
  </script>
</body>
</html>
